<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오래된 데이터 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>오래된 데이터</b>
  <label>다시 받는 동안 <select class="sel" id="k" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="keep" selected>옛 값을 그대로 보인다</option>
    <option value="blank">비우고 스피너를 띄운다</option>
  </select></label>
  <label><input type="checkbox" id="asof" checked> 언제 숫자인지 적기</label>
  <button class="ui-btn" id="go">새로 받기</button>
</div>

<div class="pad">
  <div class="stl" id="stl">
    <span style="font-size:12px;color:var(--fg-muted)">이번 주 정산액</span>
    <span class="stl__v" id="v">1,284만</span>
    <span class="stl__asof" id="as"></span>
  </div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="log"></p>
</div>

<p class="hint">
  다시 받는 동안 화면을 <b>비울지 옛 값을 둘지</b>가 갈립니다.
  비우면 그동안 <b>아무것도 못 읽습니다</b> — 데모가 <b>숫자가 사라져 있던 시간(ms)</b>을 재서 적습니다.
  옛 값을 두면 그 시간이 <b>0</b>입니다.<br>
  대신 옛 값에는 <b>언제 숫자인지</b>를 붙여야 합니다 — '3분 전 기준'이 없으면
  방금 받은 값인 줄 압니다. 체크를 끄고 보면 숫자만 덩그러니 남습니다.<br>
  다시 받는 동안에는 숫자를 <b>흐리게</b> 해 '지금 바뀌는 중'임을 알립니다.
</p>

<script>
(function () {
  var VALUES = ['1,284만', '1,301만', '1,318만'];
  var idx = 0, ageMin = 3, blankStart = 0, blankMs = 0, busy = false, ageT = null;

  function render(why) {
    var asofOn = document.getElementById('asof').checked;
    var stl = document.getElementById('stl');
    stl.className = 'stl' + (ageMin >= 2 && !busy ? ' old' : '');
    var v = document.getElementById('v');
    if (busy && document.getElementById('k').value === 'blank') {
      v.textContent = '';
      v.innerHTML = '<span class="stl__blank">불러오는 중…</span>';
    } else {
      v.textContent = VALUES[idx];
      v.style.opacity = busy ? '.45' : '1';
    }
    document.getElementById('as').textContent = asofOn
      ? (busy ? '다시 받는 중…' : (ageMin === 0 ? '방금 기준' : ageMin + '분 전 기준'))
      : '';

    var rd = document.getElementById('read');
    rd.innerHTML = '값 <b>' + VALUES[idx] + '</b> · ' + (ageMin === 0 ? '방금' : ageMin + '분 전') + ' 기준' +
      '<br>숫자가 사라져 있던 시간 <b>' + blankMs + 'ms</b>' +
      (blankMs > 0 ? ' <span class="warn">— 그동안 아무것도 못 읽는다</span>' : '') +
      '<br>언제 숫자인지 적기 <b>' + (asofOn ? '켬' : '끔') + '</b>' +
      (!asofOn ? ' <span class="warn">— 방금 값인 줄 안다</span>' : '') +
      (why ? '<br>' + why : '');
    rd.dataset.blank = String(blankMs);
    rd.dataset.asof = asofOn ? '1' : '0';
    rd.dataset.age = String(ageMin);
    rd.dataset.mode = document.getElementById('k').value;
    rd.dataset.busy = busy ? '1' : '0';
  }

  document.getElementById('go').addEventListener('click', function () {
    if (busy) return;
    busy = true;
    blankMs = 0;
    if (document.getElementById('k').value === 'blank') blankStart = Date.now();
    render('다시 받는 중');
    setTimeout(function () {
      busy = false;
      if (document.getElementById('k').value === 'blank') blankMs = Date.now() - blankStart;
      idx = (idx + 1) % VALUES.length;
      ageMin = 0;
      render('');
      document.getElementById('log').innerHTML = blankMs
        ? '<span class="warn">' + blankMs + 'ms 동안 숫자가 없었다</span>'
        : '<b>옛 값을 보는 동안</b> 새 값이 들어왔다';
      clearTimeout(ageT);
      ageT = setTimeout(function () { ageMin = 3; render(''); }, 2500);
    }, 900);
  });

  ['k', 'asof'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () { blankMs = 0; render(''); });
  });
  render('새로 받기를 눌러 보세요');
})();
</script>
</body>
</html>
