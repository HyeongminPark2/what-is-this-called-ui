<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보이는 순서와 읽는 순서 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width:560px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>보이는 순서와 읽는 순서</b>
  <label>보이는 차례를 바꾸는 방법 <select class="sel" id="k" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="none">바꾸지 않음</option>
    <option value="rev">row-reverse로 뒤집기</option>
    <option value="order">order로 바꾸기</option>
    <option value="dom">마크업 순서 바꾸기</option>
  </select></label>
  <button class="ui-btn ui-btn--ghost" id="tab">Tab으로 차례대로 옮겨 보기</button>
</div>

<div class="pad">
  <div class="ord" id="row"></div>
  <p class="ordlog" id="seen"></p>
  <p class="ordlog" id="read"></p>
  <p class="ruler" id="note"></p>
</div>

<p class="hint">
  <b>Tab으로 차례대로 옮겨 보기</b>를 누르면 초점이 어느 차례로 옮겨 가는지 아래에 적힙니다.<br>
  <code>row-reverse</code>와 <code>order</code>는 <b>보이는 자리만</b> 바꿉니다. 그래서 눈으로는 취소가 먼저 보이는데
  <b>Tab은 저장으로 먼저</b> 가고, 키보드를 쓰는 사람은 보이는 차례와 다르게 움직이는 초점을 따라가야 합니다.<br>
  순서를 실제로 바꾸려면 <b>마크업 순서</b>를 바꿔야 보이는 차례와 Tab 차례가 같아집니다.
</p>

<script>
(function () {
  var BASE = ['저장', '취소', '삭제'];

  function draw() {
    var k = document.getElementById('k').value;
    var names = (k === 'dom') ? ['취소', '저장', '삭제'] : BASE.slice();
    var row = document.getElementById('row');
    row.className = 'ord' + (k === 'rev' ? ' rev' : '');
    row.innerHTML = names.map(function (n, i) {
      var ord = (k === 'order') ? (n === '취소' ? 0 : 1) : '';
      return '<span tabindex="0" data-n="' + n + '"' + (ord !== '' ? ' style="order:' + ord + '"' : '') + '>' + n + '</span>';
    }).join('');

    // 눈에 보이는 차례 — 실제로 그려진 x 좌표로 잰다
    var els = [].slice.call(row.querySelectorAll('span'));
    var visual = els.slice().sort(function (a, b) {
      return a.getBoundingClientRect().left - b.getBoundingClientRect().left;
    }).map(function (e) { return e.dataset.n; });
    var dom = els.map(function (e) { return e.dataset.n; });     // Tab 은 DOM 순서를 따른다

    var same = visual.join() === dom.join();
    var r = document.getElementById('read');
    r.innerHTML = '눈에 보이는 차례 <b>' + visual.join(' → ') + '</b><br>Tab 차례 <b>' + dom.join(' → ') + '</b>' +
      (same ? ' · 두 차례가 같습니다' : ' · <span class="warn">두 차례가 어긋납니다</span>');
    r.dataset.same = same ? '1' : '0';
    r.dataset.visual = visual.join(',');
    r.dataset.dom = dom.join(',');
    document.getElementById('seen').textContent = '';

    document.getElementById('note').innerHTML = {
      none: '보이는 차례와 Tab 차례가 같습니다. <b>기본 상태가 맞는 상태</b>입니다',
      rev: '<span class="warn">보이는 자리만 뒤집혔습니다</span>. Tab은 마크업 순서를 그대로 따라갑니다',
      order: '<span class="warn">order도 보이는 자리만 바꿉니다</span>. 한두 칸만 옮겨도 차례가 어긋납니다',
      dom: '마크업을 바꿨기 때문에 <b>보이는 차례와 Tab 차례가 같습니다</b>. 이것이 맞는 방법입니다'
    }[k];
  }

  document.getElementById('tab').addEventListener('click', function () {
    var els = [].slice.call(document.querySelectorAll('.ord span'));
    var seen = [];
    var i = 0;
    (function step() {
      if (i >= els.length) {
        document.getElementById('seen').innerHTML = '실제로 Tab을 눌러 옮겨 간 차례는 <b>' + seen.join(' → ') + '</b>입니다';
        document.getElementById('seen').dataset.seen = seen.join(',');
        return;
      }
      els[i].focus();
      seen.push(document.activeElement.dataset.n);
      i++;
      setTimeout(step, 180);
    })();
  });
  document.getElementById('k').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
