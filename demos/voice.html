<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말투와 높임 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 8px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width: 620px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
  .screen { border: 1px solid var(--line); border-radius: var(--r2); background: var(--bg); padding: var(--s4); display: grid; gap: var(--s3); }
  .screen .line { font-size: 13.5px; }
  .screen .line small { display: block; color: var(--fg-muted); font-size: 11px; margin-bottom: 2px; }
</style>
</head>
<body>

<div class="bar">
  <b>말투와 높임</b>
  <div class="pick" id="pick"></div>
  <label><input type="checkbox" id="mix"> 화면마다 다르게 쓰기</label>
</div>

<div class="pad">
  <div class="screen" id="screen"></div>
  <p class="ruler" id="verdict"></p>
  <p class="ruler" id="note"></p>
</div>

<p class="hint">
  같은 화면을 세 말투로 써 봅니다. <b>어느 하나가 옳은 것이 아니라 하나로 정하는 것</b>이 요점입니다.<br>
  <b>화면마다 다르게 쓰기</b>를 켜면 한 화면 안에서 말투가 섞입니다 — 따로 보면 다 멀쩡한데
  모아 놓으면 <b>여러 사람이 쓴 것</b>처럼 보입니다. 실제로 여러 사람이 쓰기 때문에 이렇게 됩니다.<br>
  <b>합쇼체</b>는 격식 있고 딱딱하며, <b>해요체</b>는 부드럽고 짧습니다.
  돈·계약·오류처럼 <b>책임이 걸린 말</b>은 해요체에서도 합쇼체로 적는 경우가 많습니다.
</p>

<script>
(function () {
  var LINES = [
    ['버튼', { hap: '저장', hae: '저장', ban: '저장' }],
    ['안내', { hap: '변경 사항이 저장되었습니다.', hae: '바뀐 내용을 저장했어요.', ban: '저장했어' }],
    ['오류', { hap: '정산을 저장하지 못했습니다. 잠시 후 다시 시도해 주십시오.',
               hae: '정산을 저장하지 못했어요. 잠시 뒤 다시 해 주세요.',
               ban: '저장 실패. 좀 있다 다시 해' }],
    ['빈 상태', { hap: '등록된 가맹점이 없습니다.', hae: '아직 등록한 가맹점이 없어요.', ban: '가맹점 없음' }],
    ['확인', { hap: '정말 삭제하시겠습니까?', hae: '정말 지울까요?', ban: '지울래?' }]
  ];
  var TONES = [['hap', '합쇼체'], ['hae', '해요체'], ['ban', '반말']];
  var cur = 'hae';

  function draw() {
    document.getElementById('pick').innerHTML = TONES.map(function (t) {
      return '<button type="button" aria-pressed="' + (t[0] === cur) + '" data-t="' + t[0] + '">' + t[1] + '</button>';
    }).join('');

    var mix = document.getElementById('mix').checked;
    var used = {};
    document.getElementById('screen').innerHTML = LINES.map(function (l, i) {
      var tone = mix ? TONES[i % 3][0] : cur;
      used[tone] = true;
      return '<div class="line" data-tone="' + tone + '"><small>' + l[0] + '</small>' + l[1][tone] + '</div>';
    }).join('');

    var n = Object.keys(used).length;
    var v = document.getElementById('verdict');
    v.innerHTML = n === 1
      ? '한 화면에 말투 <b>한 가지</b> — ' + TONES.find(function (t) { return t[0] === cur; })[1]
      : '<span class="warn">한 화면에 말투가 ' + n + '가지</span> — 따로 보면 멀쩡한데 모으면 어수선하다';
    v.dataset.n = String(n);

    var NOTE = {
      hap: '격식 있고 거리가 있다. <b>은행·보험·공공</b>에서 많이 쓴다. 길어지는 것이 흠',
      hae: '부드럽고 짧다. 요즘 서비스의 기본값. 다만 <b>돈·오류·약관</b>은 합쇼체로 빼기도 한다',
      ban: '친근하지만 <b>사과하거나 돈 얘기를 할 때</b> 가벼워 보인다. 쓰려면 화면 전체에 써야 한다'
    };
    document.getElementById('note').innerHTML = mix ? '섞인 상태 — 하나로 정해야 한다' : NOTE[cur];
  }

  document.getElementById('pick').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cur = b.dataset.t; draw();
  });
  document.getElementById('mix').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
