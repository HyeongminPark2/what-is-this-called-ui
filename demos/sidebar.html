<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이드바 내비게이션 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar .ui-btn { min-height: 36px; padding: 8px 13px; font-size: 13px; }
  .wrap { display: flex; min-height: 330px; }
  .main { flex: 1; min-width: 0; padding: var(--s4); }
  .main h3 { font-size: 17px; margin-bottom: var(--s3); }
  .main p { font-size: 14px; color: var(--fg-muted); }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>

<div class="bar">
  <b>결제 관리자</b>
  <button class="ui-btn ui-btn--ghost" id="rail">아이콘만 보기 (레일)</button>
</div>

<div class="wrap">
  <nav class="nav-side" id="side" aria-label="주 메뉴">
    <h4>운영</h4>
    <a href="#" data-nm="대시보드"><span class="ic"></span><span class="tx">대시보드</span></a>
    <a href="#" data-nm="거래 내역" aria-current="page"><span class="ic"></span><span class="tx">거래 내역</span><span class="cnt">584</span></a>
    <a href="#" data-nm="정산"><span class="ic"></span><span class="tx">정산</span><span class="cnt">12</span></a>
    <a href="#" data-nm="가맹점"><span class="ic"></span><span class="tx">가맹점</span></a>
    <h4>설정</h4>
    <a href="#" data-nm="알림"><span class="ic"></span><span class="tx">알림</span></a>
    <a href="#" data-nm="보안"><span class="ic"></span><span class="tx">보안</span></a>
  </nav>

  <div class="main">
    <h3 id="h">거래 내역</h3>
    <p id="p">사이드바에서 고른 곳이 여기 나옵니다. <b>지금 어디인지</b>가 사이드바에 남아 있다는 점이 핵심입니다.</p>
  </div>
</div>

<p class="hint">
  사이드바는 <b>늘 보입니다.</b> 그래서 지금 어디인지, 어디로 갈 수 있는지가 한눈에 남습니다 —
  같은 내용이 좁은 화면에서 숨었다 나오면 그건 <b>드로어</b>입니다.<br>
  <b>아이콘만 보기</b>를 눌러 보세요. 자리를 아끼되 길은 남기는 <b>레일</b>(rail)이 됩니다.
  다만 아이콘만으로는 뜻이 안 전해져서, 툴팁이나 글자를 같이 두어야 합니다.
</p>

<script>
(function () {
  var side = document.getElementById('side');
  side.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    side.querySelectorAll('a').forEach(function (x) { x.removeAttribute('aria-current'); });
    a.setAttribute('aria-current', 'page');
    document.getElementById('h').textContent = a.dataset.nm;
  });
  var btn = document.getElementById('rail');
  btn.addEventListener('click', function () {
    var on = side.classList.toggle('is-rail');
    btn.textContent = on ? '글자도 보기' : '아이콘만 보기 (레일)';
    side.querySelectorAll('a').forEach(function (a) {
      if (on) a.setAttribute('title', a.dataset.nm); else a.removeAttribute('title');
    });
  });
})();
</script>
</body>
</html>
