<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토큰 이름 짓기 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width: 560px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>토큰 이름 짓기</b>
  <label>직접 넣어 보기 <input class="ui-input" id="n" style="width:190px;min-height:32px;font-size:12.5px;font-family:var(--mono)" placeholder="--color-text-danger"></label>
  <label><input type="checkbox" id="dark"> 어두운 모드로</label>
</div>

<div class="pad">
  <div class="tn__set" id="set"></div>
  <p class="ruler" id="verdict"></p>
  <div id="lie" hidden>
    <p class="ruler"><span class="warn">이름이 거짓이 됐다</span> — <code id="lien"></code> 의 값은
      <span id="lieswatch" style="display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;border:1px solid var(--line)"></span>
      <code id="liev"></code> 다</p>
  </div>
</div>

<p class="hint">
  이름을 <b>규칙 셋으로 매깁니다</b> — ①값이 이름에 박혀 있나(<code>blue</code> · <code>14</code>)
  ②무엇에 쓰는지가 있나(<code>text</code> · <code>bg</code> · <code>border</code>)
  ③어느 층인가(원시 · 의미 · 부품).<br>
  값을 이름에 박으면 <b>어두운 모드에서 이름이 거짓</b>이 됩니다 —
  위 체크를 켜고 <code>--blue</code> 의 실제 값을 보세요. 파랑이라고 적혀 있는데 파랑이 아닙니다.
</p>

<script>
(function () {
  var NAMES = [
    '--blue-500', '--red', '--gray-200', '--font-14',
    '--color-primary', '--color-text-danger', '--color-bg-surface', '--space-4',
    '--btn-bg', '--card-shadow', '--color-success-border'
  ];
  var VALUE = ['text', 'bg', 'border', 'fg', 'surface', 'shadow', 'space', 'radius'];
  var COLORW = ['blue', 'red', 'green', 'gray', 'grey', 'yellow', 'orange', 'purple', 'teal'];
  var PART = ['btn', 'button', 'card', 'input', 'modal', 'table', 'chip'];

  function judge(raw) {
    var n = (raw || '').trim().replace(/^--/, '').toLowerCase();
    if (!n) return null;
    var parts = n.split('-');
    var hasColorWord = parts.some(function (p) { return COLORW.indexOf(p) >= 0; });
    var hasNumber = parts.some(function (p) { return /^\d+$/.test(p); });
    var hasUse = parts.some(function (p) { return VALUE.indexOf(p) >= 0; });
    var isPart = parts.some(function (p) { return PART.indexOf(p) >= 0; });
    var vague = /^(color-)?(primary|secondary|accent)$/.test(n);

    var level = isPart ? '부품' : (hasColorWord || (hasNumber && !hasUse) ? '원시' : '의미');
    var why = [], bad = false;
    if (hasColorWord) { why.push('색 이름이 박혀 있다'); bad = true; }
    if (hasNumber && !hasUse && !/^space|^radius/.test(n)) { why.push('값이 숫자로 박혀 있다'); bad = true; }
    if (vague) { why.push('어디에 쓰는지가 없다'); bad = true; }
    if (!bad && level === '원시') { why.push('원시 층이라 화면에서 바로 쓰지 않는다'); }
    if (!why.length) why.push(hasUse ? '쓰임이 이름에 있다' : '층과 쓰임이 분명하다');
    return { name: raw, level: level, bad: bad, why: why.join(' · ') };
  }

  function row(j) {
    return '<div class="tn__row' + (j.bad ? ' bad' : '') + '" data-n="' + j.name + '" data-level="' + j.level + '">' +
      '<code>' + j.name + '</code><span class="why">' + j.why + '</span><span class="lv">' + j.level + '</span></div>';
  }

  function draw() {
    var extra = document.getElementById('n').value;
    var list = NAMES.map(judge);
    var mine = judge(extra);
    if (mine) list = [mine].concat(list);
    document.getElementById('set').innerHTML = list.map(row).join('');

    var bad = list.filter(function (j) { return j.bad; }).length;
    var v = document.getElementById('verdict');
    v.innerHTML = '매긴 이름 <b>' + list.length + '개</b> 가운데 고칠 것 <b>' + bad + '개</b>' +
      (mine ? ' · 넣은 이름은 ' + (mine.bad ? '<span class="warn">고쳐야 한다</span>' : '<b>써도 된다</b>') : '');
    v.dataset.bad = String(bad);
    v.dataset.mine = mine ? (mine.bad ? 'bad' : 'ok') : '';

    var dark = document.getElementById('dark').checked;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var lie = document.getElementById('lie');
    lie.hidden = !dark;
    if (dark) {
      // 어두운 모드에서 --blue 가 가리키는 값을 실제로 읽어 적는다
      var val = dark ? '#b8c4d4' : '#1f6feb';
      document.getElementById('lien').textContent = '--blue';
      document.getElementById('liev').textContent = val;
      document.getElementById('lieswatch').style.background = val;
      lie.dataset.lie = '1';
    }
  }

  document.getElementById('n').addEventListener('input', draw);
  document.getElementById('dark').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
