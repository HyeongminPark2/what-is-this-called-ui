<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앵커 내비 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width: 520px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>앵커 내비</b>
  <label><input type="checkbox" id="margin"> scroll-margin-top 주기</label>
  <label><input type="checkbox" id="spy" checked> 보이는 절 밝히기</label>
</div>

<div class="pad">
  <div class="anv">
    <nav class="anv__list" id="nav" aria-label="이 문서 안에서"></nav>
    <div class="anv__doc" id="doc">
      <div class="anv__head" id="head">고정 머리 — 높이 <span id="hh"></span></div>
      <div id="body"></div>
    </div>
  </div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="log"></p>
</div>

<p class="hint">
  목차를 눌러 보세요. <b>고정 머리</b>가 있는 문서에서는 앵커로 뛰면 제목이
  머리 <b>밑으로 숨습니다</b> — 데모가 뛴 뒤 제목의 자리를 재서 가려졌는지 적습니다.
  <code>scroll-margin-top</code> 을 주면 머리 높이만큼 미리 떼어 놓아 제목이 보입니다.<br>
  목차는 <b>지금 보는 절</b>을 밝혀 줘야 길잡이가 됩니다. 끄면 어디쯤인지 알 수 없습니다 —
  긴 문서에서 목차가 있으나 마나 해지는 이유입니다.
</p>

<script>
(function () {
  var SECS = [
    ['s1', '정산 주기', '매주 수요일에 지난주 매출을 한 번에 보냅니다. 공휴일이 끼면 다음 영업일로 밀립니다.'],
    ['s2', '수수료', '결제 수단마다 다릅니다. 카드 2.8%, 계좌이체 1.2%, 간편결제 2.4%입니다.'],
    ['s3', '세금계산서', '매달 1일에 지난달 몫을 한 장으로 끊어 드립니다. 사업자 정보가 바뀌면 미리 알려 주세요.'],
    ['s4', '환불', '환불이 생기면 다음 정산에서 빼고 보냅니다. 정산액보다 크면 따로 청구합니다.'],
    ['s5', '문의', '정산 내역이 맞지 않으면 거래번호와 함께 알려 주시면 사흘 안에 답을 드립니다.']
  ];

  document.getElementById('nav').innerHTML = SECS.map(function (s) {
    return '<a href="#' + s[0] + '" data-s="' + s[0] + '">' + s[1] + '</a>';
  }).join('');
  document.getElementById('body').innerHTML = SECS.map(function (s) {
    return '<section class="anv__sec" id="' + s[0] + '"><h4>' + s[1] + '</h4><p>' +
      s[2] + '<br>' + s[2] + '</p></section>';
  }).join('');

  var doc = document.getElementById('doc');

  function applyMargin() {
    var on = document.getElementById('margin').checked;
    var h = document.getElementById('head').getBoundingClientRect().height;
    document.getElementById('hh').textContent = Math.round(h) + 'px';
    [].forEach.call(document.querySelectorAll('.anv__sec'), function (s) {
      s.style.scrollMarginTop = on ? Math.round(h) + 'px' : '0px';
    });
    return h;
  }

  function spy() {
    if (!document.getElementById('spy').checked) {
      [].forEach.call(document.querySelectorAll('.anv__list a'), function (a) { a.classList.remove('on'); });
      document.getElementById('read').dataset.on = '';
      return;
    }
    var h = document.getElementById('head').getBoundingClientRect().height;
    var top = doc.getBoundingClientRect().top + h + 1;
    var cur = SECS[0][0];
    SECS.forEach(function (s) {
      var r = document.getElementById(s[0]).getBoundingClientRect();
      if (r.top <= top + 2) cur = s[0];
    });
    [].forEach.call(document.querySelectorAll('.anv__list a'), function (a) {
      a.classList.toggle('on', a.dataset.s === cur);
    });
    document.getElementById('read').dataset.on = cur;
  }

  function report(id) {
    var h = document.getElementById('head').getBoundingClientRect().height;
    var r = document.getElementById(id).querySelector('h4').getBoundingClientRect();
    var docTop = doc.getBoundingClientRect().top;
    var under = r.top < docTop + h - 1;
    document.getElementById(id).classList.toggle('hidden', under);
    var rd = document.getElementById('read');
    rd.innerHTML = '뛴 곳 <b>' + id + '</b> · 제목이 문서 위에서 <b>' + Math.round(r.top - docTop) + 'px</b>' +
      ' (머리 ' + Math.round(h) + 'px)' +
      (under ? ' <span class="warn">— 머리 밑에 숨었다</span>' : ' — 보인다');
    rd.dataset.under = under ? '1' : '0';
    rd.dataset.gap = String(Math.round(r.top - docTop));
  }

  document.getElementById('nav').addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    applyMargin();
    var id = a.dataset.s;
    document.getElementById(id).scrollIntoView({ block: 'start' });
    setTimeout(function () { report(id); spy(); }, 60);
    document.getElementById('log').innerHTML = '<b>' + a.textContent + '</b> 로 뛰었다';
  });

  doc.addEventListener('scroll', spy);
  document.getElementById('margin').addEventListener('change', function () { applyMargin(); });
  document.getElementById('spy').addEventListener('change', spy);

  applyMargin();
  spy();
  document.getElementById('read').innerHTML = '목차를 눌러 보세요 — 뛴 뒤 제목 자리를 재서 적습니다';
})();
</script>
</body>
</html>
