<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에셋 내보내기 데모 · What Is This Called? — UI</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 8px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width: 620px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>

<div class="bar">
  <b>에셋 내보내기</b>
  <label>내보낼 그림 <select class="sel" id="kind" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="icon">아이콘 (24px, 단순한 선)</option>
    <option value="logo">로고 (120px, 글자 포함)</option>
    <option value="photo">사진 (가로 800px)</option>
    <option value="illust">일러스트 (300px, 그라데이션)</option>
  </select></label>
</div>

<div class="pad">
  <div class="exp" id="list"></div>
  <p class="ruler" id="verdict"></p>
  <p class="ruler" id="note"></p>
</div>

<p class="hint">
  무엇을 내보내느냐에 따라 <b>골라야 할 형식이 달라집니다.</b>
  선으로 된 아이콘과 로고는 <b>SVG</b> 파일 하나만 있으면 어느 배율에서나 선명하고 파일도 작습니다.
  반면 사진은 SVG로 만들 수 없기 때문에 <b>배율별 비트맵</b>이 필요합니다.<br>
  파일 크기는 <b>어림한 값</b>이므로, 숫자 자체보다 <b>어느 쪽이 몇 배 차이 나는지</b>를 보면 됩니다.
  자세한 배율 이야기는 <a href="../items/dpr.html">화면 밀도</a>에 있습니다.
</p>

<script>
(function () {
  // [이름, 상대 크기 계수, 쓸 수 있나, 설명]
  var TABLE = {
    icon: {
      base: 2,
      rows: [
        ['SVG', 1, true, '선 몇 개라 가장 작고, 색도 CSS로 바꿀 수 있음'],
        ['PNG 1x', 1.2, false, '2·3배 화면에서 뭉개짐'],
        ['PNG 2x', 3.4, false, '쓸 수는 있지만 SVG보다 큼'],
        ['PNG 3x', 7.1, false, '1배 기기도 쓰지 않을 큰 파일을 받게 됨']
      ],
      pick: 'SVG',
      note: '선으로 된 아이콘은 <b>SVG 한 벌</b>이면 충분합니다. 색을 CSS로 바꿀 수 있다는 것도 큰 이점입니다'
    },
    logo: {
      base: 6,
      rows: [
        ['SVG', 1, true, '글자를 윤곽선으로 바꿔 내보냄'],
        ['PNG 1x', 1.1, false, '작은 글자부터 뭉개짐'],
        ['PNG 2x', 3.2, false, '쓸 만하지만 SVG가 더 작고 선명함'],
        ['PNG 3x', 6.8, false, '배너처럼 아주 큰 자리가 아니면 과함']
      ],
      pick: 'SVG',
      note: '글꼴을 <b>윤곽선으로</b> 바꿔 내보내지 않으면 그 글꼴이 없는 곳에서 글자가 깨집니다'
    },
    photo: {
      base: 120,
      rows: [
        ['SVG', 0, false, '사진은 SVG로 만들 수 없음'],
        ['JPG 1x', 1, false, '2배 화면에서 흐림'],
        ['JPG 2x', 3.1, true, 'srcset으로 배율에 맞게 내려줌'],
        ['WebP 2x', 1.6, true, '같은 화질에 크기는 절반쯤, 요즘 기본값']
      ],
      pick: 'WebP 2x',
      note: '사진은 배율을 줄이는 것보다 <b>포맷을 바꾸는 쪽</b>이 파일 크기를 줄이는 효과가 큽니다(<a href="../items/dpr.html">화면 밀도</a> 참고)'
    },
    illust: {
      base: 40,
      rows: [
        ['SVG', 4.2, false, '그라데이션·패턴이 많으면 SVG가 더 커짐'],
        ['PNG 1x', 1, false, '배율이 높은 화면에서 뭉개짐'],
        ['PNG 2x', 3.3, true, '가장 무난함'],
        ['WebP 2x', 1.4, true, '투명도를 지원하고 더 작음']
      ],
      pick: 'WebP 2x',
      note: '<b>SVG라고 늘 작은 것은 아닙니다.</b> 점이 많아지면 비트맵보다 커집니다'
    }
  };

  function draw() {
    var k = document.getElementById('kind').value;
    var t = TABLE[k];
    var max = Math.max.apply(null, t.rows.map(function (r) { return r[1]; }));

    document.getElementById('list').innerHTML = t.rows.map(function (r) {
      var kb = (r[1] * t.base).toFixed(r[1] * t.base < 10 ? 1 : 0);
      var isPick = r[0] === t.pick;
      return '<div class="exp__row ' + (isPick ? 'pick ' : '') + (r[1] === 0 ? 'warn' : '') + '" data-k="' + r[0] + '">' +
        '<span>' + r[0] + '</span>' +
        '<span class="exp__bar" style="width:' + (r[1] === 0 ? 100 : Math.max(r[1] / max * 100, 4)) + '%' +
          (r[1] === 0 ? ';background:var(--line)' : '') + '"></span>' +
        '<span class="exp__size">' + (r[1] === 0 ? '—' : kb + ' KB') + '</span>' +
        '<span style="font-size:11px;color:var(--fg-muted)">' + r[3] + '</span></div>';
    }).join('');

    var v = document.getElementById('verdict');
    v.innerHTML = '이 경우에는 <b>' + t.pick + '</b>를 고릅니다';
    v.dataset.pick = t.pick;
    document.getElementById('note').innerHTML = t.note;
  }

  document.getElementById('kind').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
