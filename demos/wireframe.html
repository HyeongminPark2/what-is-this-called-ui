<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>와이어프레임과 목업과 시안 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); }
  .two { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: var(--s5); align-items: start; }
  @media (max-width: 680px) { .two { grid-template-columns: 1fr; } }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
  .qs { display: grid; gap: var(--s3); }
  .qs h4 { margin: 0 0 4px; font-size: 12.5px; }
  .qs ul { margin: 0; padding-left: 1.1em; font-size: 12.5px; line-height: 1.7; }
  .qs .no { color: var(--danger); }
</style>
</head>
<body>

<div class="bar">
  <b>와이어프레임과 목업과 시안</b>
  <div class="pick" id="pick"></div>
</div>

<div class="pad">
  <div class="two">
    <div>
      <div class="fid" id="fid"></div>
      <p class="fid__note" id="note"></p>
    </div>
    <div class="qs">
      <div><h4>이 단계에서 할 질문</h4><ul id="good"></ul></div>
      <div><h4 class="no">아직 하면 안 되는 질문</h4><ul id="bad" class="no"></ul></div>
    </div>
  </div>
</div>

<p class="hint">
  네 단계는 <b>얼마나 진짜 같은가</b>(충실도)로 갈립니다. 그림이 진짜에 가까울수록
  보는 사람은 <b>다른 것을 보게</b> 됩니다 — 뼈대만 그린 그림 앞에서는 구조를 말하고,
  색이 칠해진 그림 앞에서는 색을 말합니다.<br>
  그래서 단계를 섞어 보여 주면 <b>엉뚱한 리뷰</b>가 돌아옵니다. 구조를 정하고 싶은데
  색 이야기가 나오면, 그건 리뷰어 탓이 아니라 <b>그림이 그렇게 생겨서</b>입니다.
</p>

<script>
(function () {
  var K = [
    ['wire', '와이어프레임', '뼈대만. 회색 상자와 선', {
      good: ['어떤 정보가 이 화면에 있나', '무엇이 가장 중요한가', '어떤 순서로 읽히나', '이 화면에서 무엇을 할 수 있나'],
      bad: ['이 회색은 왜 이렇게 칙칙한가', '글꼴이 마음에 안 든다', '버튼 색을 바꿔 달라'],
      note: '색·글꼴을 일부러 안 쓴다 — <b>구조만 보게</b> 하려고'
    }],
    ['mock', '목업', '배치와 크기까지. 아직 색은 흐리게', {
      good: ['글이 길어지면 어떻게 되나', '폰에서는 어떻게 접히나', '빈 화면은 어떻게 보이나'],
      bad: ['여기서 저기로 어떻게 넘어가나', '애니메이션은 어떻게 되나'],
      note: '<b>자리와 크기</b>가 정해진다. 아직 눌리지는 않는다'
    }],
    ['visual', '시안', '색·글꼴·그림까지 다 입힌 완성 그림', {
      good: ['색 대비가 충분한가', '브랜드와 맞나', '아이콘이 뜻을 전하나'],
      bad: ['이 화면 구조를 바꾸자', '이 정보는 빼자'],
      note: '여기서 <b>구조를 바꾸자</b>고 하면 처음부터 다시 그려야 한다'
    }],
    ['proto', '프로토타입', '눌리는 시안. 화면끼리 이어 둔 것', {
      good: ['이 흐름이 막히는 데가 있나', '사용자가 어디서 헤매나', '단계가 너무 많지 않나'],
      bad: ['이거 이제 거의 다 된 건가요', '그대로 쓰면 되나요'],
      note: '<b>아직 코드가 아니다.</b> 눌린다고 만들어진 게 아니다'
    }]
  ];
  var cur = 0;

  function screenHtml(kind) {
    var real = kind === 'visual' || kind === 'proto';
    var cls = kind === 'wire' ? 'fid--wire' : (kind === 'mock' ? 'fid--mock' : '');
    var accent = real ? 'var(--accent)' : 'var(--ink-300)';
    return '<div class="fid__screen ' + cls + '">' +
      '<div class="fid__row"><span class="blk t"></span>' +
        '<span style="margin-left:auto;background:' + accent + ';color:' + (real ? '#fff' : 'transparent') +
        ';border-radius:4px;padding:4px 10px;font-size:11px">' + (real ? '내보내기' : '버튼') + '</span></div>' +
      '<span class="blk r" style="width:100%"></span>' +
      '<span class="blk r" style="width:86%"></span>' +
      '<div style="display:grid;gap:6px;margin-top:4px">' +
        [['모란상회 신길역점', '1,284,000원'], ['한빛아웃도어 영등포점', '9,827,500원']].map(function (r) {
          return '<div style="display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:6px 8px">' +
            '<span style="width:18px;height:18px;border-radius:4px;background:' + (real ? 'var(--accent-soft)' : 'var(--ink-100)') + '"></span>' +
            (real
              ? '<span style="flex:1;font-size:12px">' + r[0] + '<span style="display:block;font-size:10.5px;color:var(--fg-muted)">' + r[1] + '</span></span>'
              : '<span style="flex:1;display:grid;gap:3px"><span class="blk r" style="width:60%"></span><span class="blk r" style="width:35%;height:6px"></span></span>') +
            '</div>';
        }).join('') +
      '</div>' +
      (kind === 'proto' ? '<div style="margin-top:auto;font-size:11px;color:var(--accent)">→ 누르면 상세로 이어 뒀다</div>' : '') +
      '</div>';
  }

  function draw() {
    document.getElementById('pick').innerHTML = K.map(function (k, i) {
      return '<button type="button" aria-pressed="' + (i === cur) + '" data-i="' + i + '">' + k[1] + '</button>';
    }).join('');
    var k = K[cur];
    var f = document.getElementById('fid');
    f.innerHTML = screenHtml(k[0]);
    f.dataset.kind = k[0];
    document.getElementById('note').innerHTML = '<b>' + k[1] + '</b> — ' + k[2] + '. ' + k[3].note;
    document.getElementById('good').innerHTML = k[3].good.map(function (q) { return '<li>' + q + '</li>'; }).join('');
    document.getElementById('bad').innerHTML = k[3].bad.map(function (q) { return '<li>' + q + '</li>'; }).join('');
    document.getElementById('good').dataset.n = String(k[3].good.length);
  }

  document.getElementById('pick').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cur = +b.dataset.i; draw();
  });
  draw();
})();
</script>
</body>
</html>
