<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테두리와 구분선 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width: 560px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>테두리와 구분선</b>
  <label>가르는 법 <select class="sel" id="m" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="all">줄마다 테두리</option>
    <option value="sep" selected>구분선만</option>
    <option value="fill">바탕색 차이</option>
    <option value="none">아무것도 없음</option>
  </select></label>
  <label><input type="checkbox" id="cb" checked> box-sizing: border-box</label>
</div>

<div class="pad">
  <div class="bd__hold" id="hold" style="max-width:300px">
    <div class="bd m-sep" id="bd"><div class="bd__list" id="list"></div></div>
  </div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="note"></p>
</div>

<p class="hint">
  줄을 가르는 법은 넷입니다. <b>줄마다 테두리</b>를 두르면 맞닿은 자리에서 선이
  두 겹이 되어 <b>2px 이음선</b>이 생깁니다 — 아래에 잰 값이 적힙니다.<br>
  줄은 <code>width: 100%</code> 입니다. <code>box-sizing</code>을 끄면 그 100% 에 테두리가 <b>더 붙어</b>
  줄이 칸 밖으로 2px 넘칩니다.
  격자가 어긋나는 흔한 원인이라, 넘친 줄에 빨간 테를 둘러 표시합니다.
</p>

<script>
(function () {
  var ROWS = ['모란상회', '한빛아웃도어', '새벽상사', '대림유통'];
  document.getElementById('list').innerHTML = ROWS.map(function (n, i) {
    return '<div class="bd__row" data-i="' + i + '">' + n + '</div>';
  }).join('');

  function draw() {
    var m = document.getElementById('m').value;
    var cb = document.getElementById('cb').checked;
    var bd = document.getElementById('bd');
    bd.className = 'bd m-' + m + (cb ? '' : ' is-content');

    var rows = [].slice.call(document.querySelectorAll('.bd__row'));
    var cs0 = getComputedStyle(rows[0]), cs1 = getComputedStyle(rows[1]);

    // 이음선 두께 — 맞닿은 두 줄의 테두리를 실제로 더해 잰다
    var seam = Math.round(parseFloat(cs0.borderBottomWidth) + parseFloat(cs1.borderTopWidth));

    // 넘쳤나 — 짐작하지 말고 칸과 줄의 폭을 잰다
    var hold = document.getElementById('hold').getBoundingClientRect().width;
    var over = 0;
    rows.forEach(function (r) {
      var bad = r.getBoundingClientRect().width > hold + 0.5;
      r.classList.toggle('over', bad);
      if (bad) over++;
    });
    var w = Math.round(rows[0].getBoundingClientRect().width);

    var rd = document.getElementById('read');
    rd.innerHTML = '이음선 <b>' + seam + 'px</b>' + (seam > 1 ? ' <span class="warn">— 두 겹이다</span>' : '') +
      '<br>칸 <b>' + Math.round(hold) + 'px</b> · 줄 <b>' + w + 'px</b>' +
      (over ? ' <span class="warn">— ' + over + '줄이 넘쳤다</span>' : '');
    rd.dataset.seam = String(seam);
    rd.dataset.over = String(over);
    rd.dataset.sizing = cs0.boxSizing;

    document.getElementById('note').innerHTML = {
      all: '<span class="warn">줄마다 테두리</span> — 선이 두 겹이 되고 칸마다 네모가 겹쳐 어수선하다',
      sep: '<b>구분선만</b> — 선 하나로 나뉜다. 목록의 기본값으로 삼기 좋다',
      fill: '<b>바탕색 차이</b> — 선이 없어 조용하다. 줄이 많을 때 편하다',
      none: '<span class="warn">아무것도 없음</span> — 어디서 줄이 끊기는지 알 수 없다'
    }[m];
  }

  document.getElementById('m').addEventListener('change', draw);
  document.getElementById('cb').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
