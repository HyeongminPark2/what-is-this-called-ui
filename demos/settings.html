<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설정 화면 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width: 480px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
  .grp { border: 1px solid var(--line); border-radius: var(--r2); padding: var(--s3); }
  .grp h4 { margin: 0 0 var(--s2); font-size: 12px; color: var(--fg-muted); }
</style>
</head>
<body>

<div class="bar">
  <b>설정 화면</b>
  <label><input type="checkbox" id="save"> 저장 버튼 방식으로</label>
  <label><input type="checkbox" id="group" checked> 묶어서 보여 주기</label>
</div>

<div class="pad">
  <div class="scr">
    <div class="scr__bar">설정 <span class="sp" id="mode"></span></div>
    <div class="scr__body">
      <input class="ui-input" id="q" type="search" placeholder="설정 검색 — ‘알림’ 이라고 쳐 보세요">
      <div id="list"></div>
      <div class="danger-zone">
        <h4>위험 구역</h4>
        <p style="margin:0;font-size:12px;color:var(--fg-muted)">계정을 지우면 되돌릴 수 없습니다.</p>
        <button class="ui-btn ui-btn--ghost" style="color:var(--danger);border-color:var(--danger);justify-self:start">계정 삭제</button>
      </div>
    </div>
    <div class="scr__foot" id="foot" hidden>
      <button class="ui-btn" id="apply">저장</button>
      <button class="ui-btn ui-btn--ghost" id="reset">되돌리기</button>
      <span class="ruler sp" id="dirty" style="margin-left:auto"></span>
    </div>
  </div>
  <p class="ruler" id="log"></p>
</div>

<p class="hint">
  <b>스위치는 바로 적용, 체크박스는 저장</b> — 이 약속이 셋 모두 같습니다.
  위 체크로 두 방식을 바꿔 보세요.<br>
  <b>저장 버튼 방식</b>에서는 바꾼 줄에 '바뀜' 표시가 붙고, 저장하지 않으면 남아 있습니다.
  바로 적용 방식에는 저장 버튼이 아예 없어야 합니다 — <b>있는데 안 눌러도 적용되면</b>
  사용자는 무엇이 저장됐는지 알 수 없습니다.<br>
  설정이 스무 줄을 넘으면 <b>검색</b>이 묶음보다 빨리 찾게 해 줍니다.
</p>

<script>
(function () {
  var ROWS = [
    ['알림', '새 정산 알림', '정산이 들어오면 알려 줍니다', true],
    ['알림', '주간 요약 메일', '월요일 아침에 한 번', false],
    ['알림', '마케팅 수신', '새 기능·행사 소식', false],
    ['화면', '다크 모드 따라가기', '기기 설정을 따릅니다', true],
    ['화면', '숫자를 큰 단위로', '1,284,000 → 128만', false],
    ['계정', '2단계 인증', '로그인할 때 한 번 더 확인', true],
    ['계정', '로그인 알림', '새 기기에서 들어오면 알려 줍니다', true]
  ];
  var saved = ROWS.map(function (r) { return r[3]; });
  var cur = saved.slice();

  function render() {
    var saveMode = document.getElementById('save').checked;
    var grouped = document.getElementById('group').checked;
    var q = (document.getElementById('q').value || '').trim();
    document.getElementById('mode').textContent = saveMode ? '저장 버튼 방식' : '바로 적용';
    document.getElementById('foot').hidden = !saveMode;

    var idx = ROWS.map(function (r, i) { return i; }).filter(function (i) {
      return !q || (ROWS[i][1] + ROWS[i][2] + ROWS[i][0]).indexOf(q) >= 0;
    });

    function rowHtml(i) {
      var r = ROWS[i], dirty = saveMode && cur[i] !== saved[i];
      return '<div class="setrow' + (dirty ? ' dirty' : '') + '" data-i="' + i + '">' +
        '<span class="lab">' + r[1] + '<small>' + r[2] + '</small></span>' +
        (saveMode
          ? '<input type="checkbox" data-i="' + i + '"' + (cur[i] ? ' checked' : '') + ' aria-label="' + r[1] + '">'
          : '<button role="switch" aria-checked="' + cur[i] + '" data-i="' + i + '" class="sw__btn' +
            '" aria-label="' + r[1] + '"></button>') +
        '</div>';
    }

    var out = '';
    if (grouped) {
      ['알림', '화면', '계정'].forEach(function (g) {
        var ids = idx.filter(function (i) { return ROWS[i][0] === g; });
        if (!ids.length) return;
        out += '<div class="grp" style="margin-bottom:10px"><h4>' + g + '</h4>' + ids.map(rowHtml).join('') + '</div>';
      });
    } else {
      out = '<div class="grp">' + idx.map(rowHtml).join('') + '</div>';
    }
    if (!idx.length) out = '<p style="font-size:12.5px;color:var(--fg-muted)">‘' + q + '’에 맞는 설정이 없습니다</p>';
    document.getElementById('list').innerHTML = out;

    var n = cur.filter(function (v, i) { return v !== saved[i]; }).length;
    var d = document.getElementById('dirty');
    d.textContent = n ? n + '개 바뀜 — 저장하지 않았습니다' : '바뀐 것 없음';
    d.dataset.n = String(n);
    document.getElementById('list').dataset.rows = String(idx.length);
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var sw = e.target.closest('[role=switch]');
    if (sw) {
      var i = +sw.dataset.i;
      cur[i] = !cur[i]; saved[i] = cur[i];        // 바로 적용
      document.getElementById('log').innerHTML = '<b>' + ROWS[i][1] + '</b> — 바로 저장됐다';
      render();
    }
  });
  document.getElementById('list').addEventListener('change', function (e) {
    var cb = e.target.closest('input[type=checkbox]');
    if (cb) { cur[+cb.dataset.i] = cb.checked; render();
      document.getElementById('log').innerHTML = '바꿨지만 <b>아직 저장 전</b>이다'; }
  });
  document.getElementById('apply').addEventListener('click', function () {
    saved = cur.slice(); render();
    document.getElementById('log').innerHTML = '저장했다';
  });
  document.getElementById('reset').addEventListener('click', function () {
    cur = saved.slice(); render();
    document.getElementById('log').innerHTML = '되돌렸다';
  });
  document.getElementById('save').addEventListener('change', function () {
    cur = saved.slice(); render();
    document.getElementById('log').innerHTML = this.checked
      ? '저장 버튼 방식 — 바꿔도 <b>누르기 전엔 적용되지 않는다</b>'
      : '바로 적용 — 저장 버튼이 <b>없어야</b> 한다';
  });
  document.getElementById('group').addEventListener('change', render);
  document.getElementById('q').addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
