<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>범위 슬라이더 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>범위 슬라이더</b>
  <label><input type="checkbox" id="cross" checked> 두 손잡이가 안 넘어가게</label>
  <label><input type="checkbox" id="fields" checked> 숫자 칸도 같이 두기</label>
  <label>눈금 <select class="sel" id="step" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="1">1만원</option>
    <option value="10" selected>10만원</option>
    <option value="50">50만원</option>
  </select></label>
</div>

<div class="pad">
  <div class="rng">
    <span style="font-size:12.5px">정산 금액 범위</span>
    <div class="rng__track">
      <div class="rng__bar"><i id="fill"></i></div>
      <input type="range" id="lo" min="0" max="500" step="10" value="100" aria-label="최소 금액">
      <input type="range" id="hi" min="0" max="500" step="10" value="300" aria-label="최대 금액">
    </div>
    <div id="fieldrow" style="display:flex;gap:7px;align-items:center">
      <input class="ui-input" id="lof" style="width:84px;min-height:30px;font-size:12.5px;text-align:right" aria-label="최소 금액(만원)">
      <span style="font-size:12.5px;color:var(--fg-muted)">~</span>
      <input class="ui-input" id="hif" style="width:84px;min-height:30px;font-size:12.5px;text-align:right" aria-label="최대 금액(만원)">
      <span style="font-size:12.5px;color:var(--fg-muted)">만원</span>
    </div>
  </div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="log"></p>
</div>

<p class="hint">
  범위 슬라이더는 <b>두 손잡이</b>가 한 줄에 있습니다. 손잡이를 서로 지나치게 두면
  <b>최소가 최대보다 큰</b> 값이 만들어집니다 — 체크를 끄고 끌어 보면
  데모가 <b>뒤집힌 상태</b>를 잡아 적습니다.<br>
  슬라이더만으로는 <b>정확한 값</b>을 못 넣습니다. 눈금을 50만원으로 키우면
  데모가 <b>넣을 수 있는 값의 가짓수</b>를 세서 보여 줍니다 —
  숫자 칸은 <b>눈금에 없는 값</b>도 넣을 수 있습니다 — 그래서 같이 두는 편이 거의 늘 낫습니다.<br>
  두 손잡이가 겹치면 <b>어느 것을 잡았는지</b> 알 수 없어, 키보드에서는 Tab 으로 갈라서 다룹니다.
</p>

<script>
(function () {
  var MIN = 0, MAX = 500, last = 'lo';

  function draw(why) {
    var lo = document.getElementById('lo'), hi = document.getElementById('hi');
    var step = +document.getElementById('step').value;
    lo.step = hi.step = '1';          // 끌 때만 눈금에 맞춘다 — 숫자 칸은 1만원 단위로 넣을 수 있다
    var a = +lo.value, b = +hi.value;
    var crossGuard = document.getElementById('cross').checked;
    var flipped = a > b;
    if (crossGuard && flipped) {
      // 넘어가지 못하게 막는다 — 서로를 밀어낸다
      // 마지막에 바뀐 쪽이 다른 쪽을 밀어낸다
      if (last === 'lo') { b = a; hi.value = String(b); }
      else { a = b; lo.value = String(a); }
      flipped = false;
    }
    var left = Math.min(a, b), right = Math.max(a, b);
    var fill = document.getElementById('fill');
    fill.style.left = ((left - MIN) / (MAX - MIN) * 100) + '%';
    fill.style.width = ((right - left) / (MAX - MIN) * 100) + '%';
    fill.style.background = flipped ? 'var(--danger)' : 'var(--accent)';

    document.getElementById('fieldrow').style.display = document.getElementById('fields').checked ? '' : 'none';
    document.getElementById('lof').value = String(a);
    document.getElementById('hif').value = String(b);

    var choices = Math.floor((MAX - MIN) / step) + 1;
    var exact = (a % step !== 0) || (b % step !== 0);
    var rd = document.getElementById('read');
    rd.innerHTML = '범위 <b>' + left + ' ~ ' + right + '만원</b>' +
      (flipped ? ' <span class="warn">— 최소가 최대보다 크다</span>' : '') +
      (exact ? ' <span style="color:var(--accent)">— 눈금에 없는 값이다</span>' : '') +
      '<br>눈금 <b>' + step + '만원</b> · 끌어서 넣을 수 있는 값 <b>' + choices + '가지</b>' +
      (choices < 15 ? ' <span class="warn">— 끌어서는 원하는 값이 없을 수 있다</span>' : '') +
      '<br>숫자 칸 <b>' + (document.getElementById('fields').checked ? '있다' : '없다') + '</b>' +
      (document.getElementById('fields').checked ? '' : ' <span class="warn">— 정확한 값을 못 넣는다</span>') +
      (why ? '<br>' + why : '');
    rd.dataset.lo = String(a);
    rd.dataset.hi = String(b);
    rd.dataset.flipped = flipped ? '1' : '0';
    rd.dataset.choices = String(choices);
    rd.dataset.exact = exact ? '1' : '0';
    rd.dataset.fields = document.getElementById('fields').checked ? '1' : '0';
  }

  ['lo', 'hi'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      var step = +document.getElementById('step').value;
      this.value = String(Math.round(+this.value / step) * step);   // 끌 때는 눈금에 맞춘다
      last = id; draw('');
    });
  });
  ['lof', 'hif'].forEach(function (id, i) {
    document.getElementById(id).addEventListener('change', function () {
      var n = parseInt(this.value, 10);
      if (isNaN(n)) { draw('<span class="warn">숫자가 아니다</span>'); return; }
      n = Math.max(MIN, Math.min(MAX, n));
      last = i === 0 ? 'lo' : 'hi';
      document.getElementById(last).value = String(n);
      draw('');
      document.getElementById('log').innerHTML = '<b>숫자 칸</b>으로 정확히 넣었다';
    });
  });
  ['cross', 'fields', 'step'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () { draw(''); });
  });
  draw('');
})();
</script>
</body>
</html>
