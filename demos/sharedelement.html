<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공유 요소 전환 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width:460px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>공유 요소 전환</b>
  <label><input type="checkbox" id="shared" checked> 같은 것을 이어서 움직이기</label>
  <button class="ui-btn" id="go">열기</button>
  <button class="ui-btn ui-btn--ghost" id="back">닫기</button>
</div>

<div class="pad">
  <div class="sx" id="sx">
    <div class="sx__list" id="list"></div>
    <div class="sx__thumb" id="thumb"></div>
  </div>
  <p class="ruler" id="log"></p>
</div>

<p class="hint">
  목록의 그림이 상세의 큰 그림으로 <b>이어서</b> 자랍니다 — 같은 것이라는 걸 눈으로 알려 주는 방식입니다.<br>
  <b>이어서 움직이기</b>를 끄면 목록이 사라지고 상세가 따로 나타납니다. 같은 자료인데
  <b>관계가 안 보여</b> 어디서 왔는지 잠깐 헷갈립니다.<br>
  대신 비싼 연출입니다 — 두 화면에 <b>같은 것이 있다는 사실</b>을 코드가 알아야 하고,
  목록이 길거나 그림 크기가 다르면 자리가 어긋납니다.
</p>

<script>
(function () {
  var open = false;
  var NAMES = ['모란상회 신길역점', '한빛아웃도어 영등포점', '새벽상사 가산점'];

  function draw(animate) {
    var sx = document.getElementById('sx');
    var shared = document.getElementById('shared').checked;
    var list = document.getElementById('list');
    var thumb = document.getElementById('thumb');

    list.innerHTML = NAMES.map(function (n, i) {
      return '<div class="sx__row"><span class="sx__ph" style="visibility:' +
        (i === 0 ? 'hidden' : 'visible') + '"></span><span>' + n + '</span></div>';
    }).join('');
    list.style.transition = animate ? 'opacity 200ms linear' : 'none';
    list.style.opacity = open ? '0.15' : '1';

    thumb.style.transition = (animate && shared) ? '' : 'none';
    if (open) {
      thumb.style.left = '12px'; thumb.style.top = '12px';
      thumb.style.width = 'calc(100% - 24px)'; thumb.style.height = '96px';
    } else {
      thumb.style.left = '12px'; thumb.style.top = '12px';
      thumb.style.width = '34px'; thumb.style.height = '34px';
    }
    thumb.dataset.open = open ? '1' : '0';
    sx.dataset.shared = shared ? '1' : '0';
  }

  document.getElementById('go').addEventListener('click', function () {
    open = true; draw(true);
    document.getElementById('log').innerHTML = document.getElementById('shared').checked
      ? '같은 그림이 <b>이어서 자란다</b> — 어디서 왔는지 보인다'
      : '<span class="warn">목록이 사라지고 상세가 따로 나타난다</span> — 관계가 안 보인다';
  });
  document.getElementById('back').addEventListener('click', function () {
    open = false; draw(true);
    document.getElementById('log').innerHTML = '닫으면 <b>왔던 자리로</b> 돌아간다';
  });
  document.getElementById('shared').addEventListener('change', function () { draw(false); });
  draw(false);
})();
</script>
</body>
</html>
