<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자와 단위 쓰기 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 8px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s5); max-width: 620px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
  .sec h3 { margin: 0 0 var(--s2); font-size: 13px; }
  table.nm { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.nm th, table.nm td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.nm th { font-size: 11.5px; color: var(--fg-muted); }
  table.nm td.m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  table.nm tr.pick td { background: var(--accent-soft); font-weight: 700; }
</style>
</head>
<body>

<div class="bar">
  <b>숫자와 단위 쓰기</b>
  <label>적을 값 <input class="ui-input" id="n" type="text" inputmode="numeric" value="1284000" style="width:150px;min-height:34px;font-size:13px"></label>
  <label>놓일 자리 <select class="sel" id="where" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="table">표 안</option>
    <option value="stat">요약 타일</option>
    <option value="sentence">문장 속</option>
  </select></label>
</div>

<div class="pad">
  <div class="sec">
    <h3>같은 값을 자리에 따라 다르게 적기</h3>
    <table class="nm"><thead><tr><th>표기 방법</th><th>보이는 모습</th><th>어울리는 자리</th></tr></thead>
      <tbody id="tbl"></tbody></table>
    <p class="ruler" id="verdict"></p>
  </div>
  <div class="sec">
    <h3>건수 · 비율에서 자주 틀리는 것</h3>
    <div class="verd" id="edge"></div>
  </div>
</div>

<p class="hint">
  값과 자리를 바꿔 보세요. <b>표 안</b>에서는 세로로 견주기 쉽도록 자릿수를 맞춰 적고,
  <b>요약 타일</b>에서는 한눈에 읽히도록 크게 줄여 적고, <b>문장 속</b>에서는 소리 내어 읽는 대로 적습니다.<br>
  가장 흔한 실수는 <b>단위 없는 숫자</b>입니다. ‘1,284,000’만 적으면 원인지 건인지 알 수 없기 때문입니다.
  또 한국어는 <b>만·억</b> 단위로 끊어 읽으므로 ‘1.2M’보다 <b>‘128만 원’</b>이 훨씬 빨리 읽힙니다.
</p>

<script>
(function () {
  function comma(n) { return n.toLocaleString('ko-KR'); }

  function korShort(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(n >= 1e13 ? 0 : 1).replace(/\.0$/, '') + '조';
    if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '억';
    if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + '만';
    return comma(n);
  }

  function draw() {
    var raw = (document.getElementById('n').value || '').replace(/[^\d.-]/g, '');
    var n = Number(raw);
    if (!isFinite(n)) n = 0;
    var where = document.getElementById('where').value;

    var ROWS = [
      ['자릿수 끊기', comma(n) + '원', where === 'table', '표 · 금액 입력 · 영수증'],
      ['만 단위로 줄이기', korShort(n) + ' 원', where === 'stat', '요약 타일 · 차트 눈금'],
      ['읽는 대로 적기', korShort(n) + ' 원쯤', where === 'sentence', '문장 속 · 안내문'],
      ['단위 없이 적기', comma(n), false, '<span style="color:var(--danger)">맞는 자리가 없습니다. 원인지 건인지 알 수 없습니다</span>'],
      ['영어식으로 줄이기', (n / 1e6).toFixed(2) + 'M', false, '한국어 화면에서는 끊어 읽는 단위가 달라 맞지 않습니다']
    ];

    document.getElementById('tbl').innerHTML = ROWS.map(function (r) {
      return '<tr class="' + (r[2] ? 'pick' : '') + '" data-k="' + r[0] + '"><td>' + r[0] + '</td>' +
        '<td class="m">' + r[1] + '</td><td style="color:var(--fg-muted);font-size:11.5px">' + r[3] + '</td></tr>';
    }).join('');

    var pickRow = ROWS.find(function (r) { return r[2]; });
    var v = document.getElementById('verdict');
    v.innerHTML = '이 자리에는 <b>' + pickRow[0] + '</b> 방식이 맞습니다. 보이는 모습은 ' + pickRow[1] + '입니다';
    v.dataset.pick = pickRow[0];

    document.getElementById('edge').innerHTML = [
      ['0건', '‘0건’이라고 적기', true, '‘검색 결과가 없습니다’ 같은 문구와 함께 씁니다. <b>빈칸이나 ‘-’로 두지 않습니다</b>'],
      ['1건', '‘1건’도 그대로 적기', true, '한국어에는 복수형이 없어서 <b>영어처럼 s를 붙일 일이 없습니다</b>'],
      ['99+', '‘99+’로 줄여 적기', true, '배지처럼 자리가 좁을 때 씁니다. <b>어디서 끊을지</b> 미리 정해 둡니다'],
      ['33.333%', '‘33.3%’로 반올림하기', true, '소수점은 보통 <b>한 자리까지</b> 적습니다. 다만 비율을 모두 더하면 100이 안 될 수 있습니다'],
      ['0.5%', '‘0.5%’를 ‘1%’로 올리기', false, '작은 값을 올려 버리면 <b>0이 아닌 것이 0처럼</b> 보입니다'],
      ['-3,000원', '‘-3,000원’으로 적기', false, '빼는 돈은 <b>‘3,000원 차감’</b>처럼 말로 적는 편이 덜 헷갈립니다']
    ].map(function (e) {
      return '<div class="verd__row ' + (e[2] ? 'ok' : 'no') + '"><span class="t"><b>' + e[0] + '</b> → ' + e[1] + '</span>' +
        '<span class="v">' + (e[2] ? '이렇게 적기' : '주의할 것') + '</span>' +
        '<span class="verd__why">' + e[3] + '</span></div>';
    }).join('');
  }

  document.getElementById('n').addEventListener('input', draw);
  document.getElementById('where').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
