<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 칸 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>비밀번호 칸</b>
  <label>규칙 <select class="sel" id="k" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="len" selected>길이만 본다 (12자 이상)</option>
    <option value="class">갈래를 강제한다 (대문자·숫자·기호)</option>
  </select></label>
  <label><input type="checkbox" id="paste" checked> 붙여넣기 허용</label>
  <label><input type="checkbox" id="manager" checked> 비밀번호 관리자가 알아보게</label>
</div>

<div class="pad">
  <div class="pwd">
    <label for="p" style="font-size:12.5px">새 비밀번호</label>
    <div class="pwd__row">
      <input class="ui-input" id="p" type="password" autocomplete="new-password" aria-describedby="rule" style="min-height:34px;font-size:13px">
      <button class="ui-btn ui-btn--ghost" id="eye" aria-pressed="false" aria-label="비밀번호 보기" style="min-height:34px;padding:4px 10px;font-size:12px">보기</button>
    </div>
    <div class="pwd__bar" id="bar"><i></i><i></i><i></i><i></i></div>
    <span class="ruler" id="rule"></span>
  </div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="log"></p>
</div>

<p class="hint">
  비밀번호 칸의 핵심은 <b>무엇을 막지 않느냐</b>입니다.
  <b>붙여넣기를 막으면</b> 비밀번호 관리자를 못 쓰게 되어 오히려 약한 비밀번호를 쓰게 됩니다 —
  체크를 끄고 붙여넣어 보면 데모가 막힌 횟수를 셉니다.<br>
  <b>갈래 강제</b>(대문자·숫자·기호)는 <code>Passw0rd!</code> 같은 <b>짧고 뻔한</b> 것을 통과시키고,
  <code>그냥길게적은한국어문장입니다</code> 같은 <b>길고 센</b> 것을 막습니다 —
  데모가 두 규칙으로 각각 매겨 보여 줍니다.<br>
  <b>보기 단추</b>는 눈으로 확인할 유일한 길입니다. 상태를 <code>aria-pressed</code> 로도 알립니다.
</p>

<script>
(function () {
  var blockedPaste = 0;

  function score(v) {
    // 길이를 가장 크게 치고, 갈래는 거들기만 한다
    var n = v.length;
    var kinds = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/, /[가-힣]/].filter(function (r) { return r.test(v); }).length;
    var s = 0;
    if (n >= 8) s++;
    if (n >= 12) s++;
    if (n >= 16) s++;
    if (kinds >= 3) s++;
    return Math.min(4, s);
  }
  function passLen(v) { return v.length >= 12; }
  function passClass(v) {
    return v.length >= 8 && /[A-Z]/.test(v) && /\d/.test(v) && /[^A-Za-z0-9]/.test(v);
  }

  function draw(why) {
    var p = document.getElementById('p');
    var v = p.value;
    var k = document.getElementById('k').value;
    var okLen = passLen(v), okClass = passClass(v);
    var ok = k === 'len' ? okLen : okClass;
    var s = score(v);

    var bar = document.getElementById('bar');
    bar.className = 'pwd__bar' + (s <= 1 ? ' weak' : (s <= 2 ? ' mid' : ''));
    [].forEach.call(bar.children, function (i, idx) { i.className = idx < s ? 'on' : ''; });

    document.getElementById('rule').innerHTML = k === 'len'
      ? '12자 이상이면 됩니다 — <b>길수록 셉니다</b>'
      : '8자 이상 · 대문자 · 숫자 · 기호를 모두 넣어야 합니다';

    p.autocomplete = document.getElementById('manager').checked ? 'new-password' : 'off';

    var rd = document.getElementById('read');
    rd.innerHTML = '친 글자 <b>' + v.length + '자</b> · 세기 <b>' + s + ' / 4</b>' +
      '<br>길이 규칙 <b>' + (okLen ? '통과' : '미달') + '</b> · 갈래 규칙 <b>' + (okClass ? '통과' : '미달') + '</b>' +
      (okLen !== okClass ? ' <span class="warn">— 두 규칙의 답이 다르다</span>' : '') +
      '<br>지금 규칙으로는 <b>' + (ok ? '쓸 수 있다' : '못 쓴다') + '</b>' +
      (blockedPaste ? '<br><span class="warn">붙여넣기를 막은 횟수 ' + blockedPaste + '</span> — 관리자를 못 쓴다' : '') +
      '<br>비밀번호 관리자 <b>' + (document.getElementById('manager').checked ? '알아본다' : '못 알아본다') + '</b>' +
      (why ? '<br>' + why : '');
    rd.dataset.len = String(v.length);
    rd.dataset.score = String(s);
    rd.dataset.oklen = okLen ? '1' : '0';
    rd.dataset.okclass = okClass ? '1' : '0';
    rd.dataset.blocked = String(blockedPaste);
    rd.dataset.type = p.type;
    rd.dataset.autocomplete = p.autocomplete;
  }

  document.getElementById('p').addEventListener('input', function () { draw(''); });
  document.getElementById('p').addEventListener('paste', function (e) {
    if (document.getElementById('paste').checked) return;
    e.preventDefault();
    blockedPaste++;
    draw('<span class="warn">붙여넣기를 막았다</span> — 관리자가 넣어 주는 긴 비밀번호를 못 쓴다');
    document.getElementById('log').innerHTML = '<span class="warn">붙여넣기가 막혔다</span>';
  });
  document.getElementById('eye').addEventListener('click', function () {
    var p = document.getElementById('p');
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    this.setAttribute('aria-pressed', String(show));
    this.textContent = show ? '숨기기' : '보기';
    this.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
    draw('');
    document.getElementById('log').innerHTML = show ? '<b>보기</b>로 바꿨다' : '다시 <b>가렸다</b>';
  });
  ['k', 'paste', 'manager'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () { blockedPaste = 0; draw(''); });
  });
  document.getElementById('p').value = 'Passw0rd!';
  draw('');
})();
</script>
</body>
</html>
