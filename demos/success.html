<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성공 확인 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>성공 확인</b>
  <label>알리는 법 <select class="sel" id="k" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="none">아무것도 안 알림</option>
    <option value="toast">토스트로</option>
    <option value="inline" selected>그 자리에 글로</option>
    <option value="screen">화면을 바꿔서</option>
  </select></label>
</div>

<div class="pad">
  <div class="suc">
    <div class="suc__scr" id="scr"></div>
    <div id="toastwrap"></div>
  </div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="log"></p>
</div>

<p class="hint">
  <b>저장</b>을 눌러 보세요. 아무것도 안 알리면 <b>됐는지 알 수 없어</b> 다시 누르게 됩니다 —
  데모가 <b>같은 일을 몇 번 보냈는지</b> 셉니다. 두 번 누르면 두 번 갑니다.<br>
  알리는 법은 셋입니다. <b>토스트</b>는 몇 초 뒤 사라져서 놓치기 쉽고,
  <b>그 자리에 글</b>은 남아 있어 확실하며, <b>화면 전환</b>은 결과 화면 자체가 알림이 됩니다.
  어느 쪽이든 <code>role="status"</code> 로 <b>소리로도</b> 알려야 합니다 —
  데모가 그 여부도 같이 적습니다.
</p>

<script>
(function () {
  var sent = 0, toastT = null;

  function render(state) {
    var k = document.getElementById('k').value;
    var scr = document.getElementById('scr');
    if (k === 'screen' && state === 'done') {
      scr.innerHTML = '<div style="display:grid;gap:7px;place-items:center;padding:12px 0">' +
        '<span style="display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:#1a7f37;color:#fff;font-size:15px">✓</span>' +
        '<b style="font-size:14px">저장했습니다</b>' +
        '<span style="font-size:12px;color:var(--fg-muted)">11월 정산 설정이 바뀌었습니다</span>' +
        '<button class="ui-btn ui-btn--ghost" id="back" style="min-height:30px;padding:4px 11px;font-size:12.5px">설정으로 돌아가기</button>' +
        '</div>';
      return;
    }
    scr.innerHTML =
      '<b style="font-size:13px">정산 설정</b>' +
      '<label style="font-size:12.5px;display:grid;gap:4px">정산 주기' +
      '<select class="sel" style="min-height:32px;font-size:12.5px"><option>매주 수요일</option><option>매달 1일</option></select></label>' +
      (k === 'inline' && state === 'done'
        ? '<p class="suc__msg ok" role="status" id="msg"><span aria-hidden="true">✓</span> 저장했습니다</p>' : '') +
      '<button class="ui-btn" id="save" style="justify-self:start;min-height:32px;padding:5px 13px;font-size:12.5px">저장</button>';
  }

  function report(why) {
    var k = document.getElementById('k').value;
    var live = document.querySelectorAll('[role=status]').length;
    var rd = document.getElementById('read');
    rd.innerHTML = '알리는 법 <b>' +
      ({ none: '없음', toast: '토스트', inline: '그 자리에 글', screen: '화면 전환' }[k]) + '</b>' +
      '<br>보낸 횟수 <b>' + sent + '회</b>' +
      (sent > 1 ? ' <span class="warn">— 같은 일을 여러 번 보냈다</span>' : '') +
      '<br>소리로 알리는 자리 <b>' + live + '개</b>' +
      (k !== 'none' && live === 0 ? ' <span class="warn">— 소리로는 안 들린다</span>' : '') +
      (why ? '<br>' + why : '');
    rd.dataset.sent = String(sent);
    rd.dataset.live = String(live);
    rd.dataset.kind = k;
  }

  document.getElementById('scr').addEventListener('click', function (e) {
    if (e.target.closest('#back')) { render('idle'); report('설정으로 돌아왔다'); return; }
    if (!e.target.closest('#save')) return;
    sent++;
    var k = document.getElementById('k').value;
    if (k === 'toast') {
      clearTimeout(toastT);
      document.getElementById('toastwrap').innerHTML =
        '<div class="suc__toast" role="status">저장했습니다</div>';
      toastT = setTimeout(function () {
        document.getElementById('toastwrap').innerHTML = '';
        report('<span class="warn">토스트가 사라졌다</span> — 못 봤으면 끝이다');
      }, 2200);
      report('');
      document.getElementById('log').innerHTML = '토스트로 알렸다 — <b>2.2초</b> 뒤 사라진다';
      return;
    }
    render('done');
    report('');
    document.getElementById('log').innerHTML = {
      none: '<span class="warn">아무 일도 안 일어난 것처럼 보인다</span> — 다시 누르게 된다',
      inline: '<b>그 자리에 남는다</b> — 놓칠 일이 없다',
      screen: '<b>결과 화면</b> 자체가 알림이다'
    }[k];
  });

  document.getElementById('k').addEventListener('change', function () {
    sent = 0;
    clearTimeout(toastT);
    document.getElementById('toastwrap').innerHTML = '';
    render('idle');
    report('');
  });

  render('idle');
  report('저장을 눌러 보세요');
})();
</script>
</body>
</html>
