<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오류 문구 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width: 620px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
  .parts { display: grid; gap: 4px; font-size: 12.5px; }
  .parts .p { display: grid; grid-template-columns: 62px 1fr; gap: var(--s3); }
  .parts .p span:first-child { color: var(--fg-muted); font-size: 11.5px; }
  .parts .p.miss span:last-child { color: var(--danger); }
</style>
</head>
<body>

<div class="bar">
  <b>오류 문구</b>
  <label>어떤 오류
    <select class="sel" id="k" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
      <option value="net">연결이 끊겼을 때</option>
      <option value="val">값이 틀렸을 때</option>
      <option value="perm">권한이 없을 때</option>
      <option value="server">서버가 터졌을 때</option>
      <option value="conflict">남이 먼저 고쳤을 때</option>
    </select></label>
  <label><input type="checkbox" id="sorry"> 사과를 길게 넣기</label>
</div>

<div class="pad">
  <div class="ba" id="ba"></div>
  <div>
    <p class="ruler" style="margin:0 0 6px">고친 문구를 셋으로 뜯어보면</p>
    <div class="parts" id="parts"></div>
  </div>
  <p class="ruler" id="len"></p>
</div>

<p class="hint">
  오류 문구는 세 가지를 담습니다 — <b>무엇이 안 됐나 · 왜 그런가 · 어떻게 하면 되나</b>.
  셋 중 <b>마지막이 가장 중요</b>한데 가장 자주 빠집니다.<br>
  <b>사과를 길게 넣기</b>를 켜 보세요. 문장이 길어지는데 <b>할 수 있는 일은 하나도 안 늘어납니다</b> —
  '불편을 드려 죄송합니다'는 읽는 사람을 도와주지 않습니다.
  정말 우리 잘못일 때 <b>짧게 한 번</b>이면 충분합니다.
</p>

<script>
(function () {
  var E = {
    net: {
      bad: '네트워크 오류가 발생했습니다. (ERR_CONNECTION_TIMED_OUT)',
      what: '정산 내역을 불러오지 못했습니다',
      why: '인터넷 연결이 끊긴 것 같습니다',
      how: '연결을 확인하고 다시 시도해 주세요',
      act: '다시 시도',
      badwhy: '사용자가 할 수 있는 일이 없다. 코드는 우리만 쓴다'
    },
    val: {
      bad: '유효하지 않은 값입니다.',
      what: '사업자번호를 확인해 주세요',
      why: '10자리 숫자여야 하는데 3자리를 적으셨습니다',
      how: '- 없이 10자리를 적어 주세요',
      act: '',
      badwhy: '무엇이 어떻게 틀렸는지 하나도 안 알려 준다'
    },
    perm: {
      bad: '접근이 거부되었습니다. (403 Forbidden)',
      what: '이 정산은 열어 볼 수 없습니다',
      why: '가맹점 관리자만 볼 수 있습니다',
      how: '권한이 필요하면 조직 관리자에게 요청해 주세요',
      act: '관리자에게 요청',
      badwhy: '왜 막혔는지, 누구에게 말해야 하는지 모른다'
    },
    server: {
      bad: '알 수 없는 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.',
      what: '정산을 저장하지 못했습니다',
      why: '저희 쪽 문제입니다',
      how: '적으신 내용은 남아 있습니다. 잠시 뒤 다시 저장해 주세요',
      act: '다시 저장',
      badwhy: '사과만 있고, 적은 내용이 날아갔는지 아닌지를 안 알려 준다'
    },
    conflict: {
      bad: '저장에 실패했습니다.',
      what: '저장하지 못했습니다',
      why: '다른 사람이 2분 전에 이 정산을 고쳤습니다',
      how: '바뀐 내용을 보고 다시 저장할지 정해 주세요',
      act: '바뀐 내용 보기',
      badwhy: '왜 실패했는지 모르니 다시 눌러도 또 실패한다'
    }
  };

  function sorryText() {
    return document.getElementById('sorry').checked
      ? '이용에 불편을 드려 대단히 죄송합니다. 보다 나은 서비스를 위해 노력하겠습니다. '
      : '';
  }

  function draw() {
    var e = E[document.getElementById('k').value];
    var s = sorryText();
    var good = s + e.what + '. ' + e.why + '. ' + e.how + '.';

    document.getElementById('ba').innerHTML =
      '<div class="ba__c bad"><span class="ba__tag">흔한 문구</span>' +
        '<span class="ba__txt" id="badtxt">' + e.bad + '</span>' +
        '<span class="ba__why">' + e.badwhy + '</span></div>' +
      '<div class="ba__c good"><span class="ba__tag">고친 문구</span>' +
        '<span class="ba__txt" id="goodtxt">' + good + '</span>' +
        (e.act ? '<span class="ba__why">버튼: <b>' + e.act + '</b></span>' : '') +
      '</div>';

    document.getElementById('parts').innerHTML =
      '<div class="p"><span>무엇이</span><span>' + e.what + '</span></div>' +
      '<div class="p"><span>왜</span><span>' + e.why + '</span></div>' +
      '<div class="p"><span>어떻게</span><span>' + e.how + '</span></div>' +
      '<div class="p' + (e.act ? '' : ' miss') + '"><span>할 수 있는 일</span><span>' +
        (e.act ? e.act + ' 버튼' : '버튼 없이 안내만 — 칸을 고치면 된다') + '</span></div>';

    var l = document.getElementById('len');
    var n = good.length;
    l.innerHTML = '고친 문구 <b>' + n + '자</b>' +
      (s ? ' · <span class="warn">사과가 ' + s.length + '자를 더했지만 할 수 있는 일은 그대로다</span>' : '');
    l.dataset.len = String(n);
    l.dataset.sorry = s ? '1' : '0';
  }

  document.getElementById('k').addEventListener('change', draw);
  document.getElementById('sorry').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
