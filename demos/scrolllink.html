<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 연동 데모 · What Is This Called? — UI</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width:460px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>스크롤 연동</b>
  <label>스크롤에 맞춰 움직일 것 <select class="sel" id="k" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="bar">읽은 만큼 차는 막대 (쓸모 있음)</option>
    <option value="sticky">붙박이 머리말 (쓸모 있음)</option>
    <option value="parallax">시차 배경 (조심해서 씀)</option>
    <option value="hijack">스크롤 가로채기 (쓰지 않음)</option>
  </select></label>
  <label><input type="checkbox" id="calm"> 모션 줄이기를 켠 사람의 화면으로 보기</label>
</div>

<div class="pad">
  <div class="sc" id="sc"><div class="sc__inner" id="inner"></div></div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="note"></p>
</div>

<p class="hint">
  스크롤해 보세요. <b>읽은 만큼 막대</b>와 <b>붙박이 머리말</b>은 사용자가 글의 어디쯤에 있는지 알려 주기 때문에
  쓸모가 분명합니다.<br>
  <b>시차 배경</b>은 배경이 글보다 천천히 움직이는 연출인데, 크게 움직이면 <b>멀미를 일으킵니다</b>.
  <b>스크롤 가로채기</b>는 스크롤한 만큼 내려가지 않고 한 장씩 넘어가는 방식이라
  <b>기기가 고장 난 것처럼</b> 느껴집니다. 아래에서 직접 스크롤해 보세요.<br>
  <b>모션 줄이기</b>를 켜면 연출은 멈추고 <b>막대와 붙박이 머리말은 남습니다</b>.
</p>

<script>
(function () {
  var sc = document.getElementById('sc');
  var NOTE = {
    bar: '읽은 비율을 그대로 보여 줍니다. <b>자리 이동이 거의 없어서</b> 모션 줄이기에서도 남깁니다',
    sticky: '지금 어느 묶음을 보고 있는지 알려 줍니다. 움직이는 것이 아니라 제자리에 <b>고정</b>된 것입니다',
    parallax: '<span class="warn">배경이 글과 다른 속도로 움직입니다</span>. 크게 움직이면 멀미를 일으키므로 모션 줄이기에서 끕니다',
    hijack: '<span class="warn">스크롤한 만큼 내려가지 않습니다</span>. 기기가 고장 난 것처럼 느껴지므로 쓰지 않는 편이 낫습니다'
  };

  function build() {
    var k = document.getElementById('k').value;
    var calm = document.getElementById('calm').checked;
    var h = '';
    if (k === 'bar') h += '<div class="sc__bar"><i id="fill"></i></div>';
    if (k === 'sticky') h += '<div class="sc__hero" id="hero" style="height:34px">11월 정산</div>';
    if (k === 'parallax') h += '<div class="sc__hero" id="hero">배경</div>';
    for (var i = 1; i <= 7; i++) {
      h += '<p class="sc__p">' + i + '. 정산은 가맹점이 판 금액에서 수수료를 뺀 돈을 정해진 날에 보내 주는 일입니다. 기간과 수수료율에 따라 금액이 달라집니다.</p>';
    }
    document.getElementById('inner').innerHTML = h;
    sc.dataset.k = k;
    sc.dataset.calm = calm ? '1' : '0';
    document.getElementById('note').innerHTML = NOTE[k] + (calm ? ' · <b>모션 줄이기가 켜져 있습니다</b>' : '');
    sc.scrollTop = 0;
    onScroll();
  }

  function onScroll() {
    var k = document.getElementById('k').value;
    var calm = document.getElementById('calm').checked;
    var max = sc.scrollHeight - sc.clientHeight;
    var p = max ? sc.scrollTop / max : 0;
    var fill = document.getElementById('fill');
    if (fill) fill.style.width = (p * 100).toFixed(1) + '%';
    var hero = document.getElementById('hero');
    if (hero && k === 'parallax') {
      hero.style.transform = calm ? 'none' : 'translateY(' + (sc.scrollTop * 0.4).toFixed(0) + 'px)';
    }
    var r = document.getElementById('read');
    r.innerHTML = '지금까지 읽은 비율 <b>' + Math.round(p * 100) + '%</b>' +
      (k === 'hijack' ? ' · <span class="warn">스크롤한 양보다 적게 내려갑니다</span>' : '');
    r.dataset.p = String(Math.round(p * 100));
  }

  sc.addEventListener('wheel', function (e) {
    if (document.getElementById('k').value !== 'hijack') return;
    e.preventDefault();                       // 가로채기 — 일부러 나쁜 쪽을 보여 준다
    sc.scrollTop += Math.sign(e.deltaY) * 90;
    onScroll();
  }, { passive: false });

  sc.addEventListener('scroll', onScroll);
  document.getElementById('k').addEventListener('change', build);
  document.getElementById('calm').addEventListener('change', build);
  build();
})();
</script>
</body>
</html>
