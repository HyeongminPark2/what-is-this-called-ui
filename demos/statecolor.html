<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상태 색 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width: 560px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="deut" color-interpolation-filters="sRGB">
  <feColorMatrix type="matrix" values="0.367 0.861 -0.228 0 0  0.280 0.673 0.047 0 0  -0.012 0.043 0.969 0 0  0 0 0 1 0"/>
</filter></svg>

<div class="bar">
  <b>상태 색</b>
  <label>단서 <select class="sel" id="k" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="color">색만</option>
    <option value="icon">색 + 모양</option>
    <option value="text" selected>색 + 모양 + 말</option>
  </select></label>
  <label><input type="checkbox" id="cvd"> 적록 색각 흉내</label>
</div>

<div class="pad">
  <div class="stc stc__set" id="set"></div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="note"></p>
</div>

<p class="hint">
  색만으로 상태를 가르면 <b>적록 색각인 분에게는 성공과 오류가 같은 색</b>이 됩니다 —
  아래에 두 색의 거리를 재서 적습니다. 흉내 변환은 <b>어림한 값</b>이라
  실제로 그렇게 보인다는 뜻은 아니고, '충분히 가까워 못 가른다'를 숫자로 보이려는 것입니다.<br>
  고치는 법은 <b>색을 바꾸는 게 아니라 단서를 더하는 것</b>입니다 —
  모양(✓ · !)과 말('승인됨')을 붙이면 색을 못 봐도 읽힙니다.
</p>

<script>
(function () {
  var M = [[0.367, 0.861, -0.228], [0.280, 0.673, 0.047], [-0.012, 0.043, 0.969]];
  var ROWS = [
    ['ok', '성공', '#1a7f37', '정산이 들어왔습니다', '✓', '승인됨'],
    ['warn', '주의', '#9a6700', '정산이 하루 밀렸습니다', '!', '확인 필요'],
    ['err', '오류', '#cf222e', '계좌가 맞지 않습니다', '✕', '실패'],
    ['info', '정보', '#0969da', '다음 정산은 금요일입니다', 'i', '안내']
  ];
  function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function deut(c) { return M.map(function (r) { return Math.max(0, Math.min(255, r[0] * c[0] + r[1] * c[1] + r[2] * c[2])); }); }
  function dist(a, b) { return Math.sqrt(a.reduce(function (s, v, i) { return s + (v - b[i]) * (v - b[i]); }, 0)); }

  function draw() {
    var k = document.getElementById('k').value;
    var cvd = document.getElementById('cvd').checked;
    var set = document.getElementById('set');
    set.className = 'stc stc__set' + (cvd ? ' cvd' : '');

    set.innerHTML = ROWS.map(function (r) {
      var soft = 'color-mix(in srgb, ' + r[2] + ' 12%, var(--surface))';
      return '<div class="stc__row" data-k="' + r[0] + '" style="background:' + soft + ';border-color:' +
        'color-mix(in srgb, ' + r[2] + ' 40%, transparent);color:' + r[2] + '">' +
        (k === 'color'
          ? '<span class="stc__dot" style="background:' + r[2] + '"></span>'
          : '<span class="stc__dot" style="background:' + r[2] + ';color:#fff;display:grid;place-items:center;' +
            'width:16px;height:16px;font-size:10px;line-height:1">' + r[4] + '</span>') +
        '<span style="color:var(--fg)">' + r[3] + '</span>' +
        (k === 'text' ? '<small>' + r[5] + '</small>' : '') +
        '</div>';
    }).join('');

    // 적록 흉내로 바꾼 뒤 성공과 오류의 거리를 잰다 — 가까우면 못 가른다
    var a = hex(ROWS[0][2]), b = hex(ROWS[2][2]);
    var d0 = dist(a, b), d1 = dist(deut(a), deut(b));
    var cues = k === 'color' ? 1 : (k === 'icon' ? 2 : 3);
    var same = d1 < 40;

    var rd = document.getElementById('read');
    rd.innerHTML = '성공과 오류의 색 거리 — 그대로 <b>' + Math.round(d0) + '</b>, 적록 흉내 <b>' + Math.round(d1) + '</b>' +
      (same ? ' <span class="warn">— 못 가른다</span>' : '') +
      '<br>색 말고 쓰는 단서 <b>' + (cues - 1) + '가지</b>' +
      (cues === 1 ? ' <span class="warn">— 색 하나뿐이다</span>' : '');
    rd.dataset.d0 = String(Math.round(d0));
    rd.dataset.d1 = String(Math.round(d1));
    rd.dataset.same = same ? '1' : '0';
    rd.dataset.cues = String(cues - 1);

    document.getElementById('note').innerHTML = {
      color: '<span class="warn">색만 쓴다</span> — 색을 못 보면 네 줄이 모두 같은 줄이 된다',
      icon: '모양을 더했다 — 색 없이도 <b>성공과 오류</b>가 갈린다',
      text: '<b>말까지 적었다</b> — 읽어 주는 소리만 들어도 상태를 안다'
    }[k];
  }

  document.getElementById('k').addEventListener('change', draw);
  document.getElementById('cvd').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
