<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수량 스테퍼 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>수량 스테퍼</b>
  <label>목표 수량 <input type="number" id="goal" value="24" min="1" max="99" style="width:68px" class="ui-input"></label>
  <label><input type="checkbox" id="typing" checked> 가운데 칸에 쳐서 넣기</label>
  <label><input type="checkbox" id="small"> 단추를 작게(24px)</label>
</div>

<div class="pad">
  <div style="display:grid;gap:9px;max-width:320px">
    <span style="font-size:12.5px">영수증 묶음 수량</span>
    <span class="qty" id="qty">
      <button id="minus" aria-label="하나 줄이기">−</button>
      <input id="val" value="1" inputmode="numeric" aria-label="수량">
      <button id="plus" aria-label="하나 늘리기">＋</button>
    </span>
    <button class="ui-btn ui-btn--ghost" id="run" style="justify-self:start;min-height:30px;padding:4px 11px;font-size:12.5px">목표까지 ＋만 눌러 보기</button>
  </div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="log"></p>
</div>

<p class="hint">
  스테퍼는 <b>한두 번 고칠 때</b>만 빠릅니다. 목표 수량을 24로 두고
  '<b>목표까지 ＋만 눌러 보기</b>'를 눌러 보세요 — 데모가 <b>몇 번 눌러야 하는지</b>를 세서 적습니다.
  쳐서 넣으면 <b>한 번</b>입니다.<br>
  그래서 가운데 칸은 <b>읽기 전용으로 두지 않습니다</b>. 체크를 끄면 칸이 잠겨
  큰 수를 넣을 길이 사라집니다.<br>
  단추는 <b>44px</b> 이어야 손가락이 닿습니다 — 작게 두면 데모가 터치 타깃 미달이라고 적습니다.
  그리고 <b>1에서 −</b>, <b>최대에서 ＋</b>는 꺼져 있어야 합니다.
</p>

<script>
(function () {
  var MAX = 99, v = 1, clicks = 0;

  function draw(why) {
    var typing = document.getElementById('typing').checked;
    var small = document.getElementById('small').checked;
    document.getElementById('qty').className = 'qty' + (small ? ' small' : '');
    var input = document.getElementById('val');
    input.value = String(v);
    input.readOnly = !typing;
    input.style.background = typing ? '' : 'var(--bg)';
    document.getElementById('minus').disabled = v <= 1;
    document.getElementById('plus').disabled = v >= MAX;

    var b = document.getElementById('plus').getBoundingClientRect();
    var hit = Math.round(Math.min(b.width, b.height));
    var goal = +document.getElementById('goal').value;

    var rd = document.getElementById('read');
    rd.innerHTML = '지금 수량 <b>' + v + '</b> · 목표 <b>' + goal + '</b>' +
      '<br>＋ 를 누른 횟수 <b>' + clicks + '번</b>' +
      (clicks >= 10 ? ' <span class="warn">— 쳐서 넣으면 한 번이다</span>' : '') +
      '<br>단추 크기 <b>' + hit + 'px</b>' + (hit < 44 ? ' <span class="warn">— 44px 미달</span>' : '') +
      '<br>가운데 칸 <b>' + (typing ? '쳐서 넣을 수 있다' : '잠겨 있다') + '</b>' +
      (typing ? '' : ' <span class="warn">— 큰 수를 넣을 길이 없다</span>') +
      (why ? '<br>' + why : '');
    rd.dataset.v = String(v);
    rd.dataset.clicks = String(clicks);
    rd.dataset.hit = String(hit);
    rd.dataset.typing = typing ? '1' : '0';
    rd.dataset.minus = document.getElementById('minus').disabled ? '1' : '0';
  }

  document.getElementById('plus').addEventListener('click', function () {
    if (v < MAX) { v++; clicks++; draw(''); }
  });
  document.getElementById('minus').addEventListener('click', function () {
    if (v > 1) { v--; draw(''); }
  });
  document.getElementById('val').addEventListener('change', function () {
    var n = parseInt(this.value, 10);
    if (isNaN(n)) { draw('<span class="warn">숫자가 아니다</span>'); return; }
    v = Math.max(1, Math.min(MAX, n));
    draw('');
    document.getElementById('log').innerHTML = '<b>쳐서</b> 넣었다 — 한 번에 끝났다';
  });
  document.getElementById('run').addEventListener('click', function () {
    var goal = +document.getElementById('goal').value;
    v = 1; clicks = 0;
    var t = setInterval(function () {
      if (v >= goal || v >= MAX) {
        clearInterval(t);
        document.getElementById('log').innerHTML = '목표까지 <b>' + clicks + '번</b> 눌렀다';
        draw('');
        return;
      }
      v++; clicks++; draw('');
    }, 28);
  });
  ['typing', 'small'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () { draw(''); });
  });
  document.getElementById('goal').addEventListener('change', function () { draw(''); });
  draw('');
})();
</script>
</body>
</html>
