<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포지션 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; margin: 0; }
  .bar { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar label { font-size: 13px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
  .pad { padding: var(--s4); display: grid; gap: var(--s4); max-width:520px; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="bar">
  <b>포지션</b>
  <label>값 <select class="sel" id="k" style="width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:12.5px">
    <option value="static">static (기본)</option>
    <option value="relative">relative</option>
    <option value="absolute">absolute</option>
    <option value="fixed">fixed</option>
    <option value="sticky">sticky</option>
  </select></label>
  <label><input type="checkbox" id="anc"> 가까운 조상에 relative 걸기</label>
</div>

<div class="pad">
  <div class="pos" id="stage">
    <div class="pos__inner">
      <div class="pos__flow">앞 줄</div>
      <div class="pos__anchor" id="anchor">
        <span style="font-size:11px;color:var(--fg-muted)" id="anchortag">조상 상자 — position: static</span>
        <div id="slot"></div>
      </div>
      <div class="pos__flow">뒷 줄</div>
      <div class="pos__flow">더 뒷 줄</div>
      <div class="pos__flow">굴려 보세요</div>
      <div class="pos__flow">아래로</div>
      <div class="pos__flow">계속</div>
    </div>
  </div>
  <p class="ruler" id="read"></p>
  <p class="ruler" id="note"></p>
</div>

<p class="hint">
  값을 바꿔 가며 <b>자리를 차지하는가</b>와 <b>무엇을 기준으로 움직이는가</b>를 보세요.<br>
  <code>absolute</code>·<code>fixed</code>는 <b>흐름에서 빠져</b> 자리를 안 차지합니다 — 점선 칸이 그 흔적입니다.
  <code>absolute</code>는 <b>가장 가까운 positioned 조상</b>을 기준으로 삼으므로,
  위 체크를 켜고 끄면 <b>기준이 통째로 바뀝니다</b>.<br>
  <code>sticky</code>는 굴리기 전에는 <code>relative</code>처럼, 넘어가면 <code>fixed</code>처럼 움직입니다 —
  <a href="../items/sticky.html">스티키</a>에 자세히 있습니다.
</p>

<script>
(function () {
  var NOTE = {
    static: '기본값. <b>흐름대로</b> 놓이고 top·left 를 줘도 안 먹는다',
    relative: '<b>자리는 그대로 두고</b> 보이기만 옮긴다 — 뒤 줄이 안 당겨진다',
    absolute: '흐름에서 <b>빠진다</b>. 기준은 <b>가장 가까운 positioned 조상</b>이다',
    fixed: '흐름에서 빠지고 <b>화면</b>을 기준으로 붙는다 — 굴려도 안 움직인다',
    sticky: '굴리기 전엔 relative, 넘어가면 fixed 처럼. <b>자리는 계속 차지한다</b>'
  };

  function draw() {
    var k = document.getElementById('k').value;
    var anc = document.getElementById('anc').checked;
    var anchor = document.getElementById('anchor');
    anchor.style.position = anc ? 'relative' : 'static';
    document.getElementById('anchortag').textContent = '조상 상자 — position: ' + (anc ? 'relative' : 'static');

    var out = '';
    var flows = k === 'absolute' || k === 'fixed';
    if (flows) out += '<div class="pos__ghost">자리를 안 차지한다</div>';
    out += '<div class="pos__box" id="box">' + k + '</div>';
    document.getElementById('slot').innerHTML = out;

    var box = document.getElementById('box');
    box.style.position = k;
    box.style.top = (k === 'static') ? '' : (k === 'sticky' ? '0' : '12px');
    box.style.left = (k === 'static' || k === 'sticky') ? '' : '12px';
    box.style.zIndex = '2';

    var r = document.getElementById('read');
    var base = (k === 'absolute')
      ? (anc ? '가까운 조상 (relative 가 걸림)' : '더 위의 조상 — 여기서는 페이지')
      : (k === 'fixed' ? '화면(뷰포트)' : (k === 'sticky' ? '굴림 상자' : '흐름'));
    r.innerHTML = '자리를 차지하나 <b>' + (flows ? '아니오' : '예') + '</b> · 기준은 <b>' + base + '</b>';
    r.dataset.flow = flows ? '0' : '1';
    r.dataset.base = base;
    document.getElementById('note').innerHTML = NOTE[k];
  }
  document.getElementById('k').addEventListener('change', draw);
  document.getElementById('anc').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
