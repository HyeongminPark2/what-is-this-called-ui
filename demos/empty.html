<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빈 상태 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; }
  .bar { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar b { font-size: 15px; margin-right: auto; }
  .seg2 { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-full); }
  .seg2 button { appearance: none; border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; color: var(--fg-muted); padding: 5px 12px; border-radius: var(--r-full); }
  .seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--e1); }
  .tools { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
  .tools .q { flex: 1; min-width: 0; padding: 8px 11px; border: 1px solid var(--line-strong); border-radius: var(--r1); font-size: 13.5px; color: var(--fg-muted); background: var(--bg); }
  .panel { min-height: 300px; display: grid; place-items: center; }
  .hint { padding: var(--s4); font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>

<div class="bar">
  <b>프로젝트</b>
  <div class="seg2" role="group" aria-label="빈 상태 종류">
    <button type="button" data-k="first" aria-pressed="true">처음</button>
    <button type="button" data-k="search" aria-pressed="false">검색 결과 없음</button>
    <button type="button" data-k="cleared" aria-pressed="false">다 지움</button>
  </div>
</div>

<div class="tools" id="tools" hidden><span class="q" id="q">“환불 대기”</span></div>

<div class="panel" id="panel"></div>

<p class="hint">
  셋 다 "아무것도 없는 화면"이지만 <b>해야 할 말이 전혀 다릅니다.</b>
  처음이면 <b>첫 걸음</b>을 알려 주고, 검색 결과가 없으면 <b>조건을 느슨하게</b> 할 길을 주고,
  다 지운 뒤면 <b>잘 끝냈다</b>고 말해 줍니다. 셋을 같은 "데이터가 없습니다"로 때우면 세 번 다 쓸모가 없습니다.
</p>

<script>
(function () {
  var panel = document.getElementById('panel');
  var tools = document.getElementById('tools');
  var VIEWS = {
    first: {
      tools: false,
      html: '<div class="empty">' +
        '<div class="empty__art">＋</div>' +
        '<h3>아직 프로젝트가 없습니다</h3>' +
        '<p>첫 프로젝트를 만들면 팀원을 부르고 지표를 모을 수 있습니다.</p>' +
        '<div class="acts"><button class="ui-btn">프로젝트 만들기</button>' +
        '<button class="ui-btn ui-btn--ghost">가져오기</button></div></div>'
    },
    search: {
      tools: true,
      html: '<div class="empty">' +
        '<div class="empty__art empty__art--quiet">⌕</div>' +
        '<h3>“환불 대기”에 맞는 것이 없습니다</h3>' +
        '<p>철자를 확인하거나, 걸어 둔 조건 두 개를 풀어 보세요.</p>' +
        '<div class="acts"><button class="ui-btn ui-btn--ghost">조건 모두 지우기</button>' +
        '<button class="ui-btn ui-btn--ghost">‘환불’로 다시 찾기</button></div></div>'
    },
    cleared: {
      tools: false,
      html: '<div class="empty">' +
        '<div class="empty__art" style="background:#e4f4ea;color:#1f8a4c">✓</div>' +
        '<h3>다 처리했습니다</h3>' +
        '<p>오늘 들어온 문의 12건을 모두 끝냈습니다. 새로 들어오면 여기에 쌓입니다.</p>' +
        '<div class="acts"><button class="ui-btn ui-btn--ghost">처리한 것 보기</button></div></div>'
    }
  };

  function show(k) {
    document.querySelectorAll('.seg2 button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.k === k));
    });
    tools.hidden = !VIEWS[k].tools;
    panel.innerHTML = VIEWS[k].html;
  }

  document.querySelector('.seg2').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]');
    if (b) show(b.dataset.k);
  });
  show('first');
})();
</script>
</body>
</html>
