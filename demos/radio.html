<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라디오 그룹 데모 — 이름표</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  body { background: var(--surface); font-size: 15px; }
  .bar { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
  .bar b { font-size: 15px; margin-right: auto; }
  .pad { padding: var(--s4); }
  .out { font-size: 13.5px; color: var(--fg-muted); padding: 0 var(--s4) var(--s3); }
  .out b { color: var(--fg); }
  .hint { padding: 0 var(--s4) var(--s5); font-size: 13px; color: var(--fg-muted); }
</style>
</head>
<body>

<div class="bar"><b>정산 방식</b></div>

<form class="pad" id="form">
  <fieldset class="grp">
    <legend>정산 주기 <span style="color:var(--danger)">*</span></legend>
    <p class="hint" style="padding:0;margin:0 0 8px">하나만 고를 수 있습니다. 기본값이 미리 잡혀 있지 않습니다.</p>
    <label class="ck ck--boxed"><input type="radio" name="cycle" value="매일">
      <span class="tx"><b>매일</b><span>영업일마다 정산합니다. 수수료가 가장 높습니다.</span></span></label>
    <label class="ck ck--boxed"><input type="radio" name="cycle" value="주 1회">
      <span class="tx"><b>주 1회</b><span>월요일에 지난주 몫을 한 번에 보냅니다.</span></span></label>
    <label class="ck ck--boxed"><input type="radio" name="cycle" value="월 1회">
      <span class="tx"><b>월 1회</b><span>매달 1일. 수수료가 가장 낮습니다.</span></span></label>
    <p class="f__err" id="err" hidden>정산 주기를 골라 주세요.</p>
  </fieldset>

  <fieldset class="grp">
    <legend>세금계산서</legend>
    <label class="ck"><input type="radio" name="tax" value="자동" checked>
      <span class="tx"><b>자동 발행</b></span></label>
    <label class="ck"><input type="radio" name="tax" value="수동">
      <span class="tx"><b>직접 발행</b></span></label>
    <label class="ck"><input type="radio" name="tax" value="안 함" disabled>
      <span class="tx"><b>발행하지 않음</b><span>사업자만 고를 수 있습니다</span></span></label>
  </fieldset>

  <button class="ui-btn" type="submit">저장</button>
</form>

<p class="out" id="out"></p>

<p class="hint">
  <b>한 칸을 고른 뒤 <kbd>↓</kbd><kbd>↑</kbd>를 눌러 보세요.</b> 그룹 안에서 옮겨지고, 옮기는 즉시 그 값이 골라집니다.
  <kbd>Tab</kbd>은 그룹 전체를 <b>한 칸</b>으로 지나갑니다 — 선택지가 열 개여도 Tab 한 번입니다.<br>
  라디오는 <b>한 번 고르면 아무것도 안 고른 상태로 되돌릴 수 없습니다.</b>
  '선택 안 함'이 뜻이 있는 자리라면 그 선택지를 직접 넣어 주거나, 체크박스를 써야 합니다.
</p>

<script>
(function () {
  var form = document.getElementById('form'), out = document.getElementById('out'), err = document.getElementById('err');
  function show() {
    var c = form.querySelector('[name=cycle]:checked');
    var t = form.querySelector('[name=tax]:checked');
    out.innerHTML = '고른 값 — 주기 <b>' + (c ? c.value : '아직 없음') + '</b> · 세금계산서 <b>' + t.value + '</b>';
  }
  form.addEventListener('change', function () { err.hidden = true; show(); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var c = form.querySelector('[name=cycle]:checked');
    err.hidden = !!c;
    if (!c) { form.querySelector('[name=cycle]').focus(); return; }
    alert('저장했습니다 (데모)');
  });
  show();
})();
</script>
</body>
</html>
